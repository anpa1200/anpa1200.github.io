<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title description">
  <title id="title">CTI case study: evading a malware classifier</title>
  <desc id="description">A proposition-level evidence map for MITRE ATLAS case AML.CS0003, separating the Skylight demonstration, CERT/CC-recorded vendor response, local reproduction, inference, and unknown customer impact.</desc>
  <rect width="1400" height="788" fill="#fbfcff" />
  <style>
    .title { fill:#071548; font:700 45px Inter,system-ui,sans-serif; }
    .subtitle { fill:#14245f; font:400 20px Inter,system-ui,sans-serif; }
    .panel { fill:#fff; stroke:#315be8; stroke-width:2; rx:14; }
    .panel-title { fill:#0b2aa0; font:700 21px Inter,system-ui,sans-serif; }
    .label { fill:#071548; font:700 16px Inter,system-ui,sans-serif; }
    .text { fill:#17245a; font:400 15px Inter,system-ui,sans-serif; }
    .small { fill:#27366d; font:400 13px Inter,system-ui,sans-serif; }
    .rule { stroke:#9ab2ff; stroke-width:1.5; stroke-dasharray:5 5; }
    .alert { fill:#fff8f7; stroke:#e32620; stroke-width:2; rx:14; }
    .alert-text { fill:#d51b16; font:700 20px Inter,system-ui,sans-serif; }
  </style>
  <text class="title" x="60" y="70">14. CTI case study: evading a malware classifier</text>
  <text class="subtitle" x="60" y="108">Public research guides a bounded hypothesis; proposition-level evidence is required before assessing customer impact.</text>

  <rect class="panel" x="60" y="145" width="400" height="245" />
  <text class="panel-title" x="85" y="180">1) Case and scope</text>
  <text class="label" x="85" y="220">MITRE ATLAS</text><text class="text" x="230" y="220">AML.CS0003 · v2026.07</text>
  <path class="rule" d="M85 238H435" />
  <text class="label" x="85" y="270">Research</text><text class="text" x="230" y="270">Skylight Cyber · July 2019</text>
  <path class="rule" d="M85 288H435" />
  <text class="label" x="85" y="320">Target</text><text class="text" x="230" y="320">Cylance malware detection</text>
  <path class="rule" d="M85 338H435" />
  <text class="small" x="85" y="365">A disclosed capability demonstration is not evidence</text>
  <text class="small" x="85" y="383">that every tenant or product version was affected.</text>

  <rect class="panel" x="480" y="145" width="860" height="245" />
  <text class="panel-title" x="505" y="180">2) What the researchers reported</text>
  <text class="label" x="510" y="225">Reverse engineer</text><text class="text" x="650" y="225">→</text>
  <text class="label" x="685" y="225">Observe string bias</text><text class="text" x="855" y="225">→</text>
  <text class="label" x="890" y="225">Append strings</text><text class="text" x="1025" y="225">→</text>
  <text class="label" x="1060" y="225">Measure score and decision</text>
  <path class="rule" d="M505 250H1315" />
  <text class="label" x="510" y="285">10 / 10</text><text class="text" x="605" y="285">May 2019 malware-set samples bypassed</text>
  <text class="label" x="510" y="320">83.59%</text><text class="text" x="605" y="320">of a separate 384-sample set after one application</text>
  <text class="label" x="510" y="355">88.54%</text><text class="text" x="605" y="355">after repeated application</text>
  <text class="small" x="1035" y="285">Researcher-reported results</text>
  <text class="small" x="1035" y="307">for the tested engine, samples,</text>
  <text class="small" x="1035" y="329">and procedure—not a global rate.</text>

  <rect class="panel" x="60" y="410" width="620" height="245" />
  <text class="panel-title" x="85" y="445">3) Evidence classification by proposition</text>
  <text class="label" x="85" y="485">Demonstrated</text><text class="text" x="225" y="485">Skylight capability on the stated engine and samples</text>
  <text class="label" x="85" y="520">Observed</text><text class="text" x="225" y="520">CERT/CC preserves the vendor statement and patch boundary</text>
  <text class="label" x="85" y="555">Reproduced</text><text class="text" x="225" y="555">Authorized local rerun under documented conditions</text>
  <text class="label" x="85" y="590">Inferred</text><text class="text" x="225" y="590">Similarity between a local miss and the public mechanism</text>
  <text class="label" x="85" y="625">Unknown</text><text class="text" x="225" y="625">Tenant exposure or customer impact without local evidence</text>

  <rect class="panel" x="700" y="410" width="640" height="245" />
  <text class="panel-title" x="725" y="445">4) Local evidence required</text>
  <text class="text" x="725" y="485">Original file + transformed file + hashes</text>
  <text class="text" x="725" y="520">Parser and feature output + engine and model version</text>
  <text class="text" x="725" y="555">Primary and secondary route + score and threshold policy</text>
  <text class="text" x="725" y="590">Identity + local telemetry + downstream action</text>
  <text class="text" x="725" y="625">Patch or remediation state + residual unknowns</text>

  <rect class="alert" x="60" y="680" width="1280" height="78" />
  <text class="alert-text" x="700" y="713" text-anchor="middle">Security consequence: preserve the artifact, parser, version, route, decision, and remediation evidence</text>
  <text class="alert-text" x="700" y="741" text-anchor="middle">before turning a public demonstration into a claim about local customer impact.</text>
</svg>
