<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title description">
  <title id="title">Controls, ATLAS mapping, and Chapter 3 analyst exercise</title>
  <desc id="description">Four panels connect current MITRE ATLAS v2026.07 identifiers, control questions, the analyst deliverable, and the ten-point completion rubric with the five-term evidence ladder.</desc>
  <rect width="1400" height="788" fill="#fbfcff" />
  <style>
    .title { fill:#071548; font:700 44px Inter,system-ui,sans-serif; }
    .subtitle { fill:#14245f; font:400 20px Inter,system-ui,sans-serif; }
    .panel { fill:#fff; stroke:#315be8; stroke-width:2; rx:14; }
    .panel-title { fill:#0b2aa0; font:700 20px Inter,system-ui,sans-serif; }
    .label { fill:#071548; font:700 14px Inter,system-ui,sans-serif; }
    .text { fill:#17245a; font:400 13px Inter,system-ui,sans-serif; }
    .compact { fill:#17245a; font:400 11.5px Inter,system-ui,sans-serif; }
    .rule { stroke:#a9baff; stroke-width:1.2; stroke-dasharray:4 4; }
    .alert { fill:#fff8f7; stroke:#e32620; stroke-width:2; rx:14; }
    .alert-text { fill:#d51b16; font:700 20px Inter,system-ui,sans-serif; }
  </style>
  <text class="title" x="60" y="70">15. Controls, ATLAS mapping, and analyst exercise</text>
  <text class="subtitle" x="60" y="108">Turn terminology into versioned control points, evidence records, an assessable deliverable, and explicit residual unknowns.</text>

  <rect class="panel" x="50" y="145" width="310" height="500" />
  <text class="panel-title" x="75" y="180">1) ATLAS v2026.07</text>
  <text class="label" x="75" y="216">AML.T0043</text><text class="text" x="170" y="216">Craft Adversarial Data</text>
  <text class="label" x="75" y="254">AML.T0015</text><text class="text" x="170" y="254">Evade AI Model</text>
  <text class="label" x="75" y="292">AML.T0018</text><text class="text" x="170" y="292">Manipulate AI Model</text>
  <text class="label" x="75" y="330">AML.T0018.000</text><text class="text" x="185" y="330">Poison AI Model</text>
  <text class="label" x="75" y="368">AML.T0020</text><text class="text" x="170" y="368">Training Data Poisoning</text>
  <text class="label" x="75" y="406">AML.T0043.004</text><text class="text" x="185" y="406">Insert Backdoor Trigger</text>
  <text class="label" x="75" y="444">AML.T0024</text><text class="compact" x="170" y="438"><tspan x="170">Exfiltration via AI</tspan><tspan x="170" dy="14">Inference API</tspan></text>
  <text class="label" x="75" y="482">AML.T0040</text><text class="compact" x="170" y="476"><tspan x="170">AI Model Inference</tspan><tspan x="170" dy="14">API Access</tspan></text>
  <text class="label" x="75" y="520">AML.T0044</text><text class="text" x="170" y="520">Full AI Model Access</text>
  <text class="label" x="75" y="558">AML.CS0003</text><text class="compact" x="170" y="552"><tspan x="170">Bypassing Cylance's AI</tspan><tspan x="170" dy="14">Malware Detection</tspan></text>
  <path class="rule" d="M75 580H335" />
  <text class="text" x="75" y="610">Preserve the ID and content version;</text>
  <text class="text" x="75" y="630">titles and scopes can evolve.</text>

  <rect class="panel" x="380" y="145" width="310" height="500" />
  <text class="panel-title" x="405" y="180">2) Control questions</text>
  <text class="label" x="405" y="220">What was trained?</text>
  <text class="text" x="405" y="244">Data, labels, code, model, loader</text>
  <path class="rule" d="M405 262H665" />
  <text class="label" x="405" y="298">How was it trained?</text>
  <text class="text" x="405" y="322">Procedure, seeds, dependencies, logs</text>
  <path class="rule" d="M405 340H665" />
  <text class="label" x="405" y="376">What was released?</text>
  <text class="text" x="405" y="400">Digest, configuration, parser, route</text>
  <path class="rule" d="M405 418H665" />
  <text class="label" x="405" y="454">What happened at inference?</text>
  <text class="text" x="405" y="478">Identity, input, score, policy, action</text>
  <path class="rule" d="M405 496H665" />
  <text class="label" x="405" y="532">What could output reveal?</text>
  <text class="text" x="405" y="556">Data, model IP, behavior, access paths</text>

  <rect class="panel" x="710" y="145" width="310" height="500" />
  <text class="panel-title" x="735" y="180">3) Learner deliverable</text>
  <text class="label" x="735" y="220">1.</text><text class="text" x="765" y="220">Draw the complete system graph</text>
  <text class="label" x="735" y="262">2.</text><text class="text" x="765" y="262">Version artifacts and event evidence</text>
  <text class="label" x="735" y="304">3.</text><text class="text" x="765" y="304">Write one bounded hypothesis</text>
  <text class="label" x="735" y="346">4.</text><text class="text" x="765" y="346">Name a distinguishing observable</text>
  <text class="label" x="735" y="388">5.</text><text class="text" x="765" y="388">State access + both budgets</text>
  <text class="label" x="735" y="430">6.</text><text class="text" x="765" y="430">Classify each proposition</text>
  <text class="label" x="735" y="472">7.</text><text class="text" x="765" y="472">Propose control + telemetry</text>
  <text class="label" x="735" y="514">8.</text><text class="text" x="765" y="514">Record bypass + residual unknown</text>
  <path class="rule" d="M735 540H995" />
  <text class="text" x="735" y="575">Use synthetic or explicitly authorized</text>
  <text class="text" x="735" y="598">data. Never upload confidential samples.</text>

  <rect class="panel" x="1040" y="145" width="310" height="500" />
  <text class="panel-title" x="1065" y="180">4) Completion criteria</text>
  <text class="label" x="1065" y="220">10-point rubric · pass 8/10</text>
  <text class="text" x="1065" y="252">2 · system graph</text>
  <text class="text" x="1065" y="282">2 · versioned evidence</text>
  <text class="text" x="1065" y="312">2 · bounded hypothesis</text>
  <text class="text" x="1065" y="342">2 · access, budgets, evidence</text>
  <text class="text" x="1065" y="372">2 · control, telemetry, unknowns</text>
  <path class="rule" d="M1065 395H1325" />
  <text class="label" x="1065" y="430">Five-term evidence ladder</text>
  <text class="text" x="1065" y="462">Observed</text>
  <text class="text" x="1065" y="492">Reproduced</text>
  <text class="text" x="1065" y="522">Demonstrated</text>
  <text class="text" x="1065" y="552">Inferred</text>
  <text class="text" x="1065" y="582">Unknown</text>
  <text class="text" x="1065" y="620">Label the proposition—not the file.</text>

  <rect class="alert" x="60" y="680" width="1280" height="78" />
  <text class="alert-text" x="700" y="713" text-anchor="middle">Security consequence: every object needs an owner, a control point, and an evidence record.</text>
  <text class="alert-text" x="700" y="741" text-anchor="middle">ATLAS supplies vocabulary; defensible conclusions still require local artifacts and telemetry.</text>
</svg>
