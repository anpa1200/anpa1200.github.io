<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title description">
  <title id="title">What comes next: the LLM lifecycle</title>
  <desc id="description">A lifecycle roadmap showing a core model path with optional adaptation and quantization branches, changing artifacts, analyst questions, and provenance requirements.</desc>
  <rect width="1672" height="941" fill="#f8fbff"/>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0b2a6b" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#315be8"/>
    </marker>
    <marker id="arrow-optional" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#d97706"/>
    </marker>
  </defs>
  <style>
    .title{fill:#071548;font:750 52px Inter,"Segoe UI",Arial,sans-serif;letter-spacing:-1px}
    .subtitle{fill:#25386f;font:400 23px Inter,"Segoe UI",Arial,sans-serif}
    .panel{fill:#fff;stroke:#315be8;stroke-width:2;rx:18;filter:url(#shadow)}
    .panel-title{fill:#0b2aa0;font:700 25px Inter,"Segoe UI",Arial,sans-serif}
    .label{fill:#071548;font:700 17px Inter,"Segoe UI",Arial,sans-serif}
    .body{fill:#263968;font:400 16px Inter,"Segoe UI",Arial,sans-serif}
    .small{fill:#263968;font:400 14px Inter,"Segoe UI",Arial,sans-serif}
    .stage{fill:#eef4ff;stroke:#315be8;stroke-width:1.6;rx:14}
    .optional{fill:#fffaf0;stroke:#d97706;stroke-width:1.6;stroke-dasharray:6 4;rx:13}
    .optional-label{fill:#9a5200;font:700 14px Inter,"Segoe UI",Arial,sans-serif}
    .flow{fill:none;stroke:#315be8;stroke-width:2.2;marker-end:url(#arrow)}
    .branch{fill:none;stroke:#d97706;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#arrow-optional)}
    .chip{fill:#f4f7ff;stroke:#91a8f5;stroke-width:1.3;rx:10}
    .accent{fill:#0b2aa0}
    .warn{fill:#fff7f6;stroke:#dc2626;stroke-width:2;rx:17}
    .warn-text{fill:#c91d1d;font:700 21px Inter,"Segoe UI",Arial,sans-serif}
    .num{fill:#fff;font:700 16px Inter,"Segoe UI",Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}
  </style>

  <path d="M0 58H105L134 29H205" fill="none" stroke="#9db4ff" stroke-width="3"/>
  <circle cx="105" cy="58" r="5" fill="#f8fbff" stroke="#6889f0" stroke-width="2"/>
  <path d="M1550 92h52l25 25h45M1588 45v47" fill="none" stroke="#9db4ff" stroke-width="3"/>
  <circle cx="1588" cy="45" r="5" fill="#f8fbff" stroke="#6889f0" stroke-width="2"/>
  <text class="title" x="58" y="78">19. What comes next</text>
  <text class="subtitle" x="60" y="124">Follow the LLM lifecycle while preserving provenance across every stage, branch, handoff, and retired artifact.</text>

  <rect class="panel" x="48" y="160" width="1576" height="320"/>
  <text class="panel-title" x="74" y="199">1) Lifecycle paths — implementations may skip, repeat, or reorder stages</text>
  <g transform="translate(75 238)">
    <rect class="stage" width="210" height="84"/><text class="label" x="105" y="29" text-anchor="middle">Model acquisition</text><text class="small" x="105" y="52" text-anchor="middle"><tspan x="105">pre-training or</tspan><tspan x="105" dy="17">sourced base model</tspan></text>
    <path class="flow" d="M218 42H274"/>
    <rect class="stage" x="282" width="210" height="84"/><text class="label" x="387" y="34" text-anchor="middle">Adaptation choice</text><text class="small" x="387" y="59" text-anchor="middle">evaluate what the system needs</text>
    <path class="flow" d="M500 42H556"/>
    <rect class="stage" x="564" width="180" height="84"/><text class="label" x="654" y="34" text-anchor="middle">Release</text><text class="small" x="654" y="59" text-anchor="middle">approve exact artifacts</text>
    <path class="flow" d="M752 42H808"/>
    <rect class="stage" x="816" width="180" height="84"/><text class="label" x="906" y="34" text-anchor="middle">Serving</text><text class="small" x="906" y="59" text-anchor="middle">route and execute</text>
    <path class="flow" d="M1004 42H1060"/>
    <rect class="stage" x="1068" width="180" height="84"/><text class="label" x="1158" y="34" text-anchor="middle">Monitoring</text><text class="small" x="1158" y="59" text-anchor="middle">measure and respond</text>
    <path class="flow" d="M1256 42H1312"/>
    <rect class="stage" x="1320" width="170" height="84"/><text class="label" x="1405" y="34" text-anchor="middle">Retirement</text><text class="small" x="1405" y="59" text-anchor="middle">revoke and preserve</text>

    <path class="branch" d="M387 88V116H153"/>
    <path class="branch" d="M387 88V116H387"/>
    <path class="branch" d="M387 88V116H621"/>
    <rect class="optional" x="50" y="123" width="206" height="70"/><text class="optional-label" x="153" y="147" text-anchor="middle">OPTIONAL ADAPTATION</text><text class="body" x="153" y="174" text-anchor="middle">instruction tuning</text>
    <rect class="optional" x="284" y="123" width="206" height="70"/><text class="optional-label" x="387" y="147" text-anchor="middle">OPTIONAL ADAPTATION</text><text class="body" x="387" y="174" text-anchor="middle">preference optimization</text>
    <rect class="optional" x="518" y="123" width="206" height="70"/><text class="optional-label" x="621" y="147" text-anchor="middle">OPTIONAL ADAPTATION</text><text class="body" x="621" y="174" text-anchor="middle">adapters</text>
    <path class="branch" d="M654 88V116H873"/>
    <rect class="optional" x="770" y="123" width="206" height="70"/><text class="optional-label" x="873" y="147" text-anchor="middle">OPTIONAL RELEASE VARIANT</text><text class="body" x="873" y="174" text-anchor="middle">quantization</text>
    <rect x="1024" y="123" width="462" height="70" rx="13" fill="#eefbf6" stroke="#34a876" stroke-width="1.5"/>
    <text x="1255" y="148" text-anchor="middle" fill="#15704d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">CONTROL RULE</text>
    <text class="body" x="1255" y="174" text-anchor="middle">record the actual path; never infer skipped stages</text>
  </g>

  <rect class="panel" x="48" y="502" width="770" height="276"/>
  <text class="panel-title" x="74" y="541">2) Artifacts that may change</text>
  <g class="body">
    <rect class="chip" x="76" y="570" width="216" height="44"/><text x="184" y="598" text-anchor="middle">data and checkpoints</text>
    <rect class="chip" x="310" y="570" width="216" height="44"/><text x="418" y="598" text-anchor="middle">tuning datasets</text>
    <rect class="chip" x="544" y="570" width="216" height="44"/><text x="652" y="598" text-anchor="middle">adapter weights</text>
    <rect class="chip" x="76" y="631" width="216" height="44"/><text x="184" y="659" text-anchor="middle">quantized variants</text>
    <rect class="chip" x="310" y="631" width="216" height="44"/><text x="418" y="659" text-anchor="middle">release configuration</text>
    <rect class="chip" x="544" y="631" width="216" height="44"/><text x="652" y="659" text-anchor="middle">serving stack</text>
    <rect class="chip" x="193" y="692" width="216" height="44"/><text x="301" y="720" text-anchor="middle">monitoring outputs</text>
    <rect class="chip" x="427" y="692" width="216" height="44"/><text x="535" y="720" text-anchor="middle">retirement records</text>
  </g>

  <rect class="panel" x="842" y="502" width="782" height="276"/>
  <text class="panel-title" x="868" y="541">3) Questions for analysts</text>
  <g class="body">
    <circle class="accent" cx="887" cy="580" r="17"/><text class="num" x="887" y="581">1</text><text x="919" y="586">What changed, and which artifact version is active?</text>
    <circle class="accent" cx="887" cy="626" r="17"/><text class="num" x="887" y="627">2</text><text x="919" y="632">Which stages were used, skipped, repeated, or reordered?</text>
    <circle class="accent" cx="887" cy="672" r="17"/><text class="num" x="887" y="673">3</text><text x="919" y="678">What evaluation and approval records exist?</text>
    <circle class="accent" cx="887" cy="718" r="17"/><text class="num" x="887" y="719">4</text><text x="919" y="724">Can observed behavior be traced to one lifecycle change?</text>
  </g>

  <rect class="warn" x="58" y="806" width="1556" height="98"/>
  <text class="warn-text" x="836" y="846" text-anchor="middle">Security consequence: a model is not one static object, and its lifecycle is not one mandatory linear sequence.</text>
  <text class="warn-text" x="836" y="878" text-anchor="middle">Preserve provenance across optional branches and handoffs so behavior changes can be traced and explained.</text>
</svg>
