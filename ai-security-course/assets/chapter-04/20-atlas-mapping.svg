<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title description">
  <title id="title">MITRE ATLAS v2026.07 evidence-oriented mapping</title>
  <desc id="description">A version-pinned table connecting seven MITRE ATLAS techniques to Chapter 4 behavior and the evidence required before assigning each mapping.</desc>
  <rect width="1672" height="941" fill="#f8fbff"/>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0b2a6b" flood-opacity=".09"/>
    </filter>
  </defs>
  <style>
    .title{fill:#071548;font:750 50px Inter,"Segoe UI",Arial,sans-serif;letter-spacing:-1px}
    .subtitle{fill:#25386f;font:400 22px Inter,"Segoe UI",Arial,sans-serif}
    .table{fill:#fff;stroke:#315be8;stroke-width:2;rx:18;filter:url(#shadow)}
    .thead{fill:#0b2aa0}
    .head{fill:#fff;font:700 18px Inter,"Segoe UI",Arial,sans-serif}
    .id{fill:#071548;font:700 16px Inter,"Segoe UI",Arial,sans-serif}
    .body{fill:#263968;font:400 15px Inter,"Segoe UI",Arial,sans-serif}
    .row-alt{fill:#f4f7ff}
    .rule{stroke:#b7c7f8;stroke-width:1.1}
    .version{fill:#eaf1ff;stroke:#315be8;stroke-width:1.5;rx:14}
    .version-text{fill:#0b2aa0;font:700 17px Inter,"Segoe UI",Arial,sans-serif}
    .warn{fill:#fff7f6;stroke:#dc2626;stroke-width:2;rx:17}
    .warn-text{fill:#c91d1d;font:700 20px Inter,"Segoe UI",Arial,sans-serif}
  </style>

  <path d="M0 55H105L134 26H205" fill="none" stroke="#9db4ff" stroke-width="3"/>
  <circle cx="105" cy="55" r="5" fill="#f8fbff" stroke="#6889f0" stroke-width="2"/>
  <rect class="version" x="1365" y="32" width="245" height="44"/>
  <text class="version-text" x="1487" y="60" text-anchor="middle">PINNED: v2026.07</text>
  <text class="title" x="58" y="77">MITRE ATLAS v2026.07 — evidence-oriented mapping</text>
  <text class="subtitle" x="60" y="121">Map observed behavior only after preserving the request, provenance, authorization, generation, policy, and side-effect evidence.</text>

  <rect class="table" x="40" y="151" width="1592" height="650"/>
  <path class="thead" d="M58 151H1614A18 18 0 0 1 1632 169V221H40V169A18 18 0 0 1 58 151Z"/>
  <text class="head" x="65" y="195">ATLAS v2026.07 ID and title</text>
  <text class="head" x="610" y="195">Chapter connection</text>
  <text class="head" x="1090" y="195">Evidence required before mapping</text>
  <path class="rule" d="M588 151V801M1068 151V801"/>

  <rect class="row-alt" x="42" y="303" width="1588" height="82"/>
  <rect class="row-alt" x="42" y="467" width="1588" height="82"/>
  <rect class="row-alt" x="42" y="631" width="1588" height="82"/>
  <path class="rule" d="M40 221H1632M40 303H1632M40 385H1632M40 467H1632M40 549H1632M40 631H1632M40 713H1632M40 801H1632"/>

  <text class="id" x="65" y="252"><tspan x="65">AML.T0051.000 — LLM Prompt Injection:</tspan><tspan x="65" dy="21">Direct</tspan></text>
  <text class="body" x="610" y="251"><tspan x="610">Adversary supplies the instruction</tspan><tspan x="610" dy="20">through interactive input.</tspan></text>
  <text class="body" x="1090" y="241"><tspan x="1090">Original request, identity, effective template, output,</tspan><tspan x="1090" dy="20">and the protected boundary affected.</tspan></text>

  <text class="id" x="65" y="334"><tspan x="65">AML.T0051.001 — LLM Prompt Injection:</tspan><tspan x="65" dy="21">Indirect</tspan></text>
  <text class="body" x="610" y="333"><tspan x="610">A separate data channel is ingested</tspan><tspan x="610" dy="20">by the LLM.</tspan></text>
  <text class="body" x="1090" y="323"><tspan x="1090">Retrieved object, source provenance, parser output,</tspan><tspan x="1090" dy="20">context inclusion, and generated result.</tspan></text>

  <text class="id" x="65" y="416"><tspan x="65">AML.T0051.002 — LLM Prompt Injection:</tspan><tspan x="65" dy="21">Triggered</tspan></text>
  <text class="body" x="610" y="405"><tspan x="610">A later user action or event activates</tspan><tspan x="610" dy="20">a planted instruction.</tspan></text>
  <text class="body" x="1090" y="405"><tspan x="1090">Infiltration event, activation trigger, request trace,</tspan><tspan x="1090" dy="20">and resulting behavior.</tspan></text>

  <text class="id" x="65" y="508">AML.T0070 — RAG Poisoning</text>
  <text class="body" x="610" y="487"><tspan x="610">Manipulated content is indexed and</tspan><tspan x="610" dy="20">later retrieved.</tspan></text>
  <text class="body" x="1090" y="487"><tspan x="1090">Indexed object, index version, retrieval trace,</tspan><tspan x="1090" dy="20">relevance, and source authorization.</tspan></text>

  <text class="id" x="65" y="590">AML.T0077 — LLM Response Rendering</text>
  <text class="body" x="610" y="569"><tspan x="610">Rendered output creates an external</tspan><tspan x="610" dy="20">request containing protected data.</tspan></text>
  <text class="body" x="1090" y="559"><tspan x="1090">Raw model output, renderer behavior, outbound request,</tspan><tspan x="1090" dy="20">destination, and protected-value linkage.</tspan></text>

  <text class="id" x="65" y="662"><tspan x="65">AML.T0085.000 — Data from AI Services:</tspan><tspan x="65" dy="21">RAG Databases</tspan></text>
  <text class="body" x="610" y="651"><tspan x="610">An AI service retrieves sensitive</tspan><tspan x="610" dy="20">organizational information.</tspan></text>
  <text class="body" x="1090" y="641"><tspan x="1090">Caller and tenant, source object, ACL decision,</tspan><tspan x="1090" dy="20">retrieved content, and output linkage.</tspan></text>

  <text class="id" x="65" y="744"><tspan x="65">AML.T0086 — Exfiltration via AI Agent</tspan><tspan x="65" dy="21">Tool Invocation</tspan></text>
  <text class="body" x="610" y="733"><tspan x="610">A write-capable tool carries protected data</tspan><tspan x="610" dy="20">to an adversary-controlled destination.</tspan></text>
  <text class="body" x="1090" y="723"><tspan x="1090">Proposed arguments, policy decision, executing identity,</tspan><tspan x="1090" dy="20">API result, destination, and received data.</tspan></text>

  <rect class="warn" x="58" y="824" width="1556" height="80"/>
  <text class="warn-text" x="836" y="857" text-anchor="middle">Security consequence: an ATLAS label organizes validated behavior; it does not prove that behavior occurred.</text>
  <text class="warn-text" x="836" y="886" text-anchor="middle">Preserve the stable ID and content version because titles, scopes, and relationships can evolve.</text>
</svg>
