<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title description">
  <title id="title">Decoding and generation controls</title>
  <desc id="description">A four-panel diagram showing common decoding controls, the decoding pipeline from unnormalized logits to stopping rules, security limitations, and operational controls.</desc>
  <rect width="1672" height="941" fill="#f8fbff"/>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0b2a6b" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#315be8"/>
    </marker>
  </defs>
  <style>
    .title{fill:#071548;font:750 52px Inter,"Segoe UI",Arial,sans-serif;letter-spacing:-1px}
    .subtitle{fill:#25386f;font:400 23px Inter,"Segoe UI",Arial,sans-serif}
    .panel{fill:#fff;stroke:#315be8;stroke-width:2;rx:18;filter:url(#shadow)}
    .panel-title{fill:#0b2aa0;font:700 25px Inter,"Segoe UI",Arial,sans-serif}
    .label{fill:#071548;font:700 18px Inter,"Segoe UI",Arial,sans-serif}
    .stage-label{fill:#071548;font:700 15px Inter,"Segoe UI",Arial,sans-serif}
    .body{fill:#263968;font:400 16px Inter,"Segoe UI",Arial,sans-serif}
    .small{fill:#263968;font:400 14px Inter,"Segoe UI",Arial,sans-serif}
    .chip{fill:#eef4ff;stroke:#8aa5ff;stroke-width:1.5;rx:12}
    .stage{fill:#f5f8ff;stroke:#6f8cf3;stroke-width:1.5;rx:13}
    .rule{stroke:#b7c7f8;stroke-width:1.2;stroke-dasharray:4 5}
    .flow{stroke:#315be8;stroke-width:2;fill:none;marker-end:url(#arrow)}
    .accent{fill:#0b2aa0}
    .warn{fill:#fff7f6;stroke:#dc2626;stroke-width:2;rx:17}
    .warn-text{fill:#c91d1d;font:700 21px Inter,"Segoe UI",Arial,sans-serif}
    .num{fill:#fff;font:700 17px Inter,"Segoe UI",Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}
  </style>

  <path d="M0 58H105L134 29H205" fill="none" stroke="#9db4ff" stroke-width="3"/>
  <circle cx="105" cy="58" r="5" fill="#f8fbff" stroke="#6889f0" stroke-width="2"/>
  <path d="M1550 92h52l25 25h45M1588 45v47" fill="none" stroke="#9db4ff" stroke-width="3"/>
  <circle cx="1588" cy="45" r="5" fill="#f8fbff" stroke="#6889f0" stroke-width="2"/>
  <text class="title" x="58" y="78">10. Decoding and generation controls</text>
  <text class="subtitle" x="60" y="124">The model artifact does not uniquely determine the response; decoding is versioned release configuration.</text>

  <rect class="panel" x="48" y="160" width="770" height="300"/>
  <text class="panel-title" x="74" y="199">1) Common controls</text>
  <g transform="translate(74 222)">
    <rect class="chip" width="164" height="92"/><circle class="accent" cx="25" cy="27" r="16"/><text class="num" x="25" y="28">1</text>
    <text class="label" x="50" y="31">Greedy</text><text class="small" x="16" y="58"><tspan x="16">Choose the highest-</tspan><tspan x="16" dy="18">scoring candidate.</tspan></text>
  </g>
  <g transform="translate(255 222)">
    <rect class="chip" width="164" height="92"/><circle class="accent" cx="25" cy="27" r="16"/><text class="num" x="25" y="28">T</text>
    <text class="label" x="50" y="31">Temperature</text><text class="small" x="16" y="58"><tspan x="16">Rescale logits before</tspan><tspan x="16" dy="18">sampling.</tspan></text>
  </g>
  <g transform="translate(436 222)">
    <rect class="chip" width="164" height="92"/><circle class="accent" cx="25" cy="27" r="16"/><text class="num" x="25" y="28">k</text>
    <text class="label" x="50" y="31">Top-k</text><text class="small" x="16" y="58"><tspan x="16">Keep the k highest-</tspan><tspan x="16" dy="18">scoring tokens.</tspan></text>
  </g>
  <g transform="translate(617 222)">
    <rect class="chip" width="164" height="92"/><circle class="accent" cx="25" cy="27" r="16"/><text class="num" x="25" y="28">p</text>
    <text class="label" x="50" y="31">Top-p</text><text class="small" x="16" y="58"><tspan x="16">Keep the smallest set</tspan><tspan x="16" dy="18">reaching mass p.</tspan></text>
  </g>
  <g transform="translate(74 330)">
    <rect class="chip" width="225" height="92"/><circle class="accent" cx="25" cy="27" r="16"/><text class="num" x="25" y="28">#</text>
    <text class="label" x="50" y="31">Maximum new tokens</text><text class="small" x="16" y="58"><tspan x="16">Bound response-token count,</tspan><tspan x="16" dy="18">not the whole workflow.</tspan></text>
  </g>
  <g transform="translate(317 330)">
    <rect class="chip" width="225" height="92"/><circle class="accent" cx="25" cy="27" r="16"/><text class="num" x="25" y="28">■</text>
    <text class="label" x="50" y="31">Stop sequence</text><text class="small" x="16" y="58"><tspan x="16">Stop on configured token</tspan><tspan x="16" dy="18">patterns or limits.</tspan></text>
  </g>
  <g transform="translate(560 330)">
    <rect class="chip" width="221" height="92"/><circle class="accent" cx="25" cy="27" r="16"/><text class="num" x="25" y="28">↻</text>
    <text class="label" x="50" y="31">Repetition penalty</text><text class="small" x="16" y="58"><tspan x="16">Adjust scores using</tspan><tspan x="16" dy="18">previous tokens.</tspan></text>
  </g>

  <rect class="panel" x="842" y="160" width="782" height="300"/>
  <text class="panel-title" x="868" y="199">2) Decoding pipeline</text>
  <g transform="translate(870 231)">
    <rect class="stage" width="105" height="122"/><text class="stage-label" x="52" y="36" text-anchor="middle">Logits</text><text class="small" x="52" y="66" text-anchor="middle"><tspan x="52">unnormalized</tspan><tspan x="52" dy="18">next-token</tspan><tspan x="52" dy="18">scores</tspan></text>
    <path class="flow" d="M111 61H140"/>
    <rect class="stage" x="146" width="105" height="122"/><text class="stage-label" x="198" y="36" text-anchor="middle">Processors</text><text class="small" x="198" y="66" text-anchor="middle"><tspan x="198">penalties and</tspan><tspan x="198" dy="18">constraints</tspan></text>
    <path class="flow" d="M257 61H286"/>
    <rect class="stage" x="292" width="105" height="122"/><text class="stage-label" x="344" y="36" text-anchor="middle">Temperature</text><text class="small" x="344" y="66" text-anchor="middle"><tspan x="344">scale logits</tspan><tspan x="344" dy="18">if configured</tspan></text>
    <path class="flow" d="M403 61H432"/>
    <rect class="stage" x="438" width="105" height="122"/><text class="stage-label" x="490" y="36" text-anchor="middle">Filter</text><text class="small" x="490" y="66" text-anchor="middle"><tspan x="490">top-k / top-p</tspan><tspan x="490" dy="18">candidate set</tspan></text>
    <path class="flow" d="M549 61H578"/>
    <rect class="stage" x="584" width="105" height="122"/><text class="stage-label" x="636" y="36" text-anchor="middle">Select</text><text class="small" x="636" y="66" text-anchor="middle"><tspan x="636">sample or</tspan><tspan x="636" dy="18">choose</tspan></text>
  </g>
  <rect class="stage" x="1014" y="374" width="438" height="56"/>
  <text class="body" x="1233" y="408" text-anchor="middle">Append token → check stop and length rules → repeat</text>

  <rect class="panel" x="48" y="482" width="770" height="296"/>
  <text class="panel-title" x="74" y="521">3) Security limitations</text>
  <g class="body">
    <circle cx="86" cy="558" r="12" fill="#fff1f0" stroke="#dc2626"/><text x="86" y="564" text-anchor="middle" fill="#c91d1d" font-weight="700">!</text>
    <text x="112" y="564">Lower randomness does not create truth or authorization.</text>
    <path class="rule" d="M76 583H786"/>
    <circle cx="86" cy="614" r="12" fill="#fff1f0" stroke="#dc2626"/><text x="86" y="620" text-anchor="middle" fill="#c91d1d" font-weight="700">!</text>
    <text x="112" y="620">Top-k and top-p can remove a low-ranked correct token.</text>
    <path class="rule" d="M76 639H786"/>
    <circle cx="86" cy="670" r="12" fill="#fff1f0" stroke="#dc2626"/><text x="86" y="676" text-anchor="middle" fill="#c91d1d" font-weight="700">!</text>
    <text x="112" y="676">Stop matching depends on tokenization and streaming boundaries.</text>
    <path class="rule" d="M76 695H786"/>
    <circle cx="86" cy="726" r="12" fill="#fff1f0" stroke="#dc2626"/><text x="86" y="732" text-anchor="middle" fill="#c91d1d" font-weight="700">!</text>
    <text x="112" y="732">Token limits do not bound retries, tools, time, cost, or side effects.</text>
  </g>

  <rect class="panel" x="842" y="482" width="782" height="296"/>
  <text class="panel-title" x="868" y="521">4) Operational control</text>
  <g class="body">
    <circle class="accent" cx="886" cy="562" r="17"/><text class="num" x="886" y="563">1</text><text x="918" y="568">Treat decoding as security-relevant release configuration.</text>
    <circle class="accent" cx="886" cy="616" r="17"/><text class="num" x="886" y="617">2</text><text x="918" y="622">Version and log the effective configuration and provider defaults.</text>
    <circle class="accent" cx="886" cy="670" r="17"/><text class="num" x="886" y="671">3</text><text x="918" y="676">Record the candidate policy, seed behavior, and stop decisions.</text>
    <circle class="accent" cx="886" cy="724" r="17"/><text class="num" x="886" y="725">4</text><text x="918" y="712"><tspan x="918">Apply independent budgets for time, cost, tokens, retries,</tspan><tspan x="918" dy="20">tool calls, and side effects.</tspan></text>
  </g>

  <rect class="warn" x="58" y="806" width="1556" height="98"/>
  <text class="warn-text" x="836" y="846" text-anchor="middle">Security consequence: manage decoding as security-relevant configuration, separate from the base model.</text>
  <text class="warn-text" x="836" y="878" text-anchor="middle">Log what was effective, then constrain the surrounding workflow independently.</text>
</svg>
