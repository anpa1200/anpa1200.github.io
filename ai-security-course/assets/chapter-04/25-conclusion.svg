<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title description">
  <title id="title">Conclusion: the LLM request is a chain of system boundaries</title>
  <desc id="description">A four-panel conclusion showing the full request chain, the core security discipline, investigation rules, and why system-boundary reasoning remains durable.</desc>
  <rect width="1672" height="941" fill="#f8fbff"/>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0b2a6b" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#315be8"/>
    </marker>
  </defs>
  <style>
    .title{fill:#071548;font:750 54px Inter,"Segoe UI",Arial,sans-serif;letter-spacing:-1px}
    .subtitle{fill:#25386f;font:400 24px Inter,"Segoe UI",Arial,sans-serif}
    .panel{fill:#fff;stroke:#315be8;stroke-width:2;rx:18;filter:url(#shadow)}
    .panel-title{fill:#0b2aa0;font:700 25px Inter,"Segoe UI",Arial,sans-serif}
    .label{fill:#071548;font:700 16px Inter,"Segoe UI",Arial,sans-serif}
    .chain-label{fill:#071548;font:700 14px Inter,"Segoe UI",Arial,sans-serif}
    .body{fill:#263968;font:400 16px Inter,"Segoe UI",Arial,sans-serif}
    .stage{fill:#eef4ff;stroke:#315be8;stroke-width:1.5;rx:13}
    .flow{fill:none;stroke:#315be8;stroke-width:2;marker-end:url(#arrow)}
    .accent{fill:#0b2aa0}
    .num{fill:#fff;font:700 16px Inter,"Segoe UI",Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}
    .warn{fill:#fff7f6;stroke:#dc2626;stroke-width:2;rx:17}
    .warn-text{fill:#c91d1d;font:700 21px Inter,"Segoe UI",Arial,sans-serif}
  </style>

  <path d="M0 58H105L134 29H205" fill="none" stroke="#9db4ff" stroke-width="3"/>
  <circle cx="105" cy="58" r="5" fill="#f8fbff" stroke="#6889f0" stroke-width="2"/>
  <path d="M1550 92h52l25 25h45M1588 45v47" fill="none" stroke="#9db4ff" stroke-width="3"/>
  <circle cx="1588" cy="45" r="5" fill="#f8fbff" stroke="#6889f0" stroke-width="2"/>
  <text class="title" x="58" y="78">20. Conclusion</text>
  <text class="subtitle" x="60" y="124">An LLM request is a chain of system boundaries, not one opaque model event.</text>

  <rect class="panel" x="48" y="160" width="970" height="330"/>
  <text class="panel-title" x="74" y="199">1) The full chain</text>
  <g transform="translate(75 238)">
    <rect class="stage" width="92" height="128"/><circle class="accent" cx="46" cy="35" r="20"/><text class="num" x="46" y="36">ID</text><text class="chain-label" x="46" y="79" text-anchor="middle"><tspan x="46">authenticated</tspan><tspan x="46" dy="20">identity</tspan></text>
    <path class="flow" d="M98 64H122"/>
    <rect class="stage" x="128" width="92" height="128"/><circle class="accent" cx="174" cy="35" r="20"/><text class="num" x="174" y="36">C</text><text class="chain-label" x="174" y="79" text-anchor="middle"><tspan x="174">selected</tspan><tspan x="174" dy="20">context</tspan></text>
    <path class="flow" d="M226 64H250"/>
    <rect class="stage" x="256" width="92" height="128"/><circle class="accent" cx="302" cy="35" r="20"/><text class="num" x="302" y="36">{ }</text><text class="chain-label" x="302" y="79" text-anchor="middle"><tspan x="302">serialization</tspan><tspan x="302" dy="20">rules</tspan></text>
    <path class="flow" d="M354 64H378"/>
    <rect class="stage" x="384" width="92" height="128"/><circle class="accent" cx="430" cy="35" r="20"/><text class="num" x="430" y="36">T</text><text class="chain-label" x="430" y="79" text-anchor="middle"><tspan x="430">tokenizer</tspan><tspan x="430" dy="20">artifacts</tspan></text>
    <path class="flow" d="M482 64H506"/>
    <rect class="stage" x="512" width="92" height="128"/><circle class="accent" cx="558" cy="35" r="20"/><text class="num" x="558" y="36">M</text><text class="chain-label" x="558" y="79" text-anchor="middle"><tspan x="558">model</tspan><tspan x="558" dy="20">execution</tspan></text>
    <path class="flow" d="M610 64H634"/>
    <rect class="stage" x="640" width="92" height="128"/><circle class="accent" cx="686" cy="35" r="20"/><text class="num" x="686" y="36">D</text><text class="chain-label" x="686" y="79" text-anchor="middle"><tspan x="686">decoding</tspan><tspan x="686" dy="20">choices</tspan></text>
    <path class="flow" d="M738 64H762"/>
    <rect class="stage" x="768" width="92" height="128"/><circle class="accent" cx="814" cy="35" r="20"/><text class="num" x="814" y="36">P</text><text class="chain-label" x="814" y="79" text-anchor="middle"><tspan x="814">parser and</tspan><tspan x="814" dy="20">validation</tspan></text>
  </g>
  <path class="flow" d="M889 366V409H212V424"/>
  <rect class="stage" x="110" y="429" width="205" height="38"/><text class="label" x="212" y="454" text-anchor="middle">policy decision</text>
  <path class="flow" d="M321 448H392"/>
  <rect class="stage" x="400" y="429" width="205" height="38"/><text class="label" x="502" y="454" text-anchor="middle">exact-action approval</text>
  <path class="flow" d="M611 448H682"/>
  <rect class="stage" x="690" y="429" width="255" height="38"/><text class="label" x="817" y="454" text-anchor="middle">least-privileged side effect</text>

  <rect class="panel" x="1042" y="160" width="582" height="330"/>
  <text class="panel-title" x="1068" y="199">2) Core security discipline</text>
  <g class="body">
    <circle class="accent" cx="1088" cy="245" r="17"/><text class="num" x="1088" y="246">1</text><text x="1120" y="251">Let the model propose content.</text>
    <circle class="accent" cx="1088" cy="293" r="17"/><text class="num" x="1088" y="294">2</text><text x="1120" y="299">Authorize retrieval before context assembly.</text>
    <circle class="accent" cx="1088" cy="341" r="17"/><text class="num" x="1088" y="342">3</text><text x="1120" y="347">Validate structured output as untrusted input.</text>
    <circle class="accent" cx="1088" cy="389" r="17"/><text class="num" x="1088" y="390">4</text><text x="1120" y="395">Approve material actions precisely.</text>
    <circle class="accent" cx="1088" cy="437" r="17"/><text class="num" x="1088" y="438">5</text><text x="1120" y="443">Execute with least privilege and log results.</text>
  </g>

  <rect class="panel" x="48" y="512" width="770" height="266"/>
  <text class="panel-title" x="74" y="551">3) Investigation rule</text>
  <g class="body">
    <circle class="accent" cx="90" cy="600" r="18"/><text class="num" x="90" y="601">1</text><text x="124" y="606">Version each link in the request and decision chain.</text>
    <circle class="accent" cx="90" cy="654" r="18"/><text class="num" x="90" y="655">2</text><text x="124" y="660">Preserve enough evidence to reproduce the result.</text>
    <circle class="accent" cx="90" cy="708" r="18"/><text class="num" x="90" y="709">3</text><text x="124" y="714">Separate observed, reproduced, inferred, and unknown.</text>
    <circle class="accent" cx="90" cy="752" r="18"/><text class="num" x="90" y="753">4</text><text x="124" y="758">State exactly where the evidence ends.</text>
  </g>

  <rect class="panel" x="842" y="512" width="782" height="266"/>
  <text class="panel-title" x="868" y="551">4) Why this approach lasts</text>
  <text class="body" x="870" y="600"><tspan x="870">System-boundary reasoning remains useful across changing architectures,</tspan><tspan x="870" dy="27">providers, model families, and interfaces.</tspan></text>
  <rect x="870" y="668" width="704" height="72" rx="13" fill="#eef4ff" stroke="#91a8f5" stroke-width="1.5"/>
  <text class="label" x="1222" y="698" text-anchor="middle">Trust comes from authenticated state and deterministic controls—</text>
  <text class="label" x="1222" y="724" text-anchor="middle">not from confidence in generated prose.</text>

  <rect class="warn" x="58" y="806" width="1556" height="98"/>
  <text class="warn-text" x="836" y="846" text-anchor="middle">Security consequence: keep trust decisions outside generation.</text>
  <text class="warn-text" x="836" y="878" text-anchor="middle">Version every link, preserve evidence, and separate generated text from authorization, policy, and execution.</text>
</svg>
