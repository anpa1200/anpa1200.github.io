<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title description">
  <title id="title">Determinism, reproducibility, and evidence</title>
  <desc id="description">A four-panel diagram showing why LLM outputs differ, the minimum reproducibility record, privacy-aware evidence practices, and an operational rule for designing evidence before incidents.</desc>
  <rect width="1672" height="941" fill="#f8fbff"/>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0b2a6b" flood-opacity=".09"/>
    </filter>
  </defs>
  <style>
    .title{fill:#071548;font:750 52px Inter,"Segoe UI",Arial,sans-serif;letter-spacing:-1px}
    .subtitle{fill:#25386f;font:400 23px Inter,"Segoe UI",Arial,sans-serif}
    .panel{fill:#fff;stroke:#315be8;stroke-width:2;rx:18;filter:url(#shadow)}
    .panel-title{fill:#0b2aa0;font:700 25px Inter,"Segoe UI",Arial,sans-serif}
    .label{fill:#071548;font:700 17px Inter,"Segoe UI",Arial,sans-serif}
    .body{fill:#263968;font:400 16px Inter,"Segoe UI",Arial,sans-serif}
    .small{fill:#263968;font:400 14px Inter,"Segoe UI",Arial,sans-serif}
    .card{fill:#f3f7ff;stroke:#91a8f5;stroke-width:1.4;rx:12}
    .rule{stroke:#b7c7f8;stroke-width:1.2;stroke-dasharray:4 5}
    .check{fill:#edf4ff;stroke:#315be8;stroke-width:1.7;rx:5}
    .checkmark{fill:none;stroke:#0b2aa0;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    .accent{fill:#0b2aa0}
    .warn{fill:#fff7f6;stroke:#dc2626;stroke-width:2;rx:17}
    .warn-text{fill:#c91d1d;font:700 21px Inter,"Segoe UI",Arial,sans-serif}
    .num{fill:#fff;font:700 16px Inter,"Segoe UI",Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}
  </style>

  <path d="M0 58H105L134 29H205" fill="none" stroke="#9db4ff" stroke-width="3"/>
  <circle cx="105" cy="58" r="5" fill="#f8fbff" stroke="#6889f0" stroke-width="2"/>
  <path d="M1550 92h52l25 25h45M1588 45v47" fill="none" stroke="#9db4ff" stroke-width="3"/>
  <circle cx="1588" cy="45" r="5" fill="#f8fbff" stroke="#6889f0" stroke-width="2"/>
  <text class="title" x="58" y="78">11. Determinism, reproducibility, and evidence</text>
  <text class="subtitle" x="60" y="124">The same visible prompt can produce different outputs; reproducibility depends on the complete request path.</text>

  <rect class="panel" x="48" y="160" width="770" height="305"/>
  <text class="panel-title" x="74" y="199">1) Why outputs differ</text>
  <g transform="translate(74 222)">
    <rect class="card" width="164" height="94"/><circle class="accent" cx="29" cy="28" r="17"/><text class="num" x="29" y="29">1</text><text class="label" x="56" y="33">Hidden context</text><text class="small" x="18" y="62"><tspan x="18">system state, retrieval,</tspan><tspan x="18" dy="18">memory, tools</tspan></text>
    <rect class="card" x="181" width="164" height="94"/><circle class="accent" cx="210" cy="28" r="17"/><text class="num" x="210" y="29">2</text><text class="label" x="237" y="33">Template</text><text class="small" x="199" y="62"><tspan x="199">serialization and</tspan><tspan x="199" dy="18">control markers</tspan></text>
    <rect class="card" x="362" width="164" height="94"/><circle class="accent" cx="391" cy="28" r="17"/><text class="num" x="391" y="29">3</text><text class="label" x="418" y="33">Tokenizer</text><text class="small" x="380" y="62"><tspan x="380">vocabulary, normalization,</tspan><tspan x="380" dy="18">truncation</tspan></text>
    <rect class="card" x="543" width="164" height="94"/><circle class="accent" cx="572" cy="28" r="17"/><text class="num" x="572" y="29">4</text><text class="label" x="599" y="33">Model route</text><text class="small" x="561" y="62"><tspan x="561">weights, adapter,</tspan><tspan x="561" dy="18">provider routing</tspan></text>
  </g>
  <g transform="translate(74 333)">
    <rect class="card" width="164" height="94"/><circle class="accent" cx="29" cy="28" r="17"/><text class="num" x="29" y="29">5</text><text class="label" x="56" y="33">Runtime</text><text class="small" x="18" y="62"><tspan x="18">precision, kernels,</tspan><tspan x="18" dy="18">hardware</tspan></text>
    <rect class="card" x="181" width="164" height="94"/><circle class="accent" cx="210" cy="28" r="17"/><text class="num" x="210" y="29">6</text><text class="label" x="237" y="33">Batching</text><text class="small" x="199" y="62"><tspan x="199">parallel ordering and</tspan><tspan x="199" dy="18">scheduling</tspan></text>
    <rect class="card" x="362" width="164" height="94"/><circle class="accent" cx="391" cy="28" r="17"/><text class="num" x="391" y="29">7</text><text class="label" x="418" y="33">Sampling</text><text class="small" x="380" y="62"><tspan x="380">decoding and</tspan><tspan x="380" dy="18">seed handling</tspan></text>
    <rect class="card" x="543" width="164" height="94"/><circle class="accent" cx="572" cy="28" r="17"/><text class="num" x="572" y="29">8</text><text class="label" x="599" y="33">Service layer</text><text class="small" x="561" y="62"><tspan x="561">provider updates and</tspan><tspan x="561" dy="18">safety layers</tspan></text>
  </g>

  <rect class="panel" x="842" y="160" width="782" height="305"/>
  <text class="panel-title" x="868" y="199">2) Minimum reproducibility record</text>
  <g class="body">
    <g transform="translate(870 228)"><rect class="check" width="27" height="27"/><path class="checkmark" d="M7 14l5 5L21 8"/><text x="39" y="20">request ID</text></g>
    <g transform="translate(870 276)"><rect class="check" width="27" height="27"/><path class="checkmark" d="M7 14l5 5L21 8"/><text x="39" y="20">identity and tenant</text></g>
    <g transform="translate(870 324)"><rect class="check" width="27" height="27"/><path class="checkmark" d="M7 14l5 5L21 8"/><text x="39" y="20">messages digest</text></g>
    <g transform="translate(870 372)"><rect class="check" width="27" height="27"/><path class="checkmark" d="M7 14l5 5L21 8"/><text x="39" y="20">context manifest</text></g>

    <g transform="translate(1122 228)"><rect class="check" width="27" height="27"/><path class="checkmark" d="M7 14l5 5L21 8"/><text x="39" y="20">template digest</text></g>
    <g transform="translate(1122 276)"><rect class="check" width="27" height="27"/><path class="checkmark" d="M7 14l5 5L21 8"/><text x="39" y="20">tokenizer and version</text></g>
    <g transform="translate(1122 324)"><rect class="check" width="27" height="27"/><path class="checkmark" d="M7 14l5 5L21 8"/><text x="39" y="20">model and adapter</text></g>
    <g transform="translate(1122 372)"><rect class="check" width="27" height="27"/><path class="checkmark" d="M7 14l5 5L21 8"/><text x="39" y="20">runtime and route</text></g>

    <g transform="translate(1383 228)"><rect class="check" width="27" height="27"/><path class="checkmark" d="M7 14l5 5L21 8"/><text x="39" y="20">generation settings</text></g>
    <g transform="translate(1383 276)"><rect class="check" width="27" height="27"/><path class="checkmark" d="M7 14l5 5L21 8"/><text x="39" y="20">raw output digest</text></g>
    <g transform="translate(1383 324)"><rect class="check" width="27" height="27"/><path class="checkmark" d="M7 14l5 5L21 8"/><text x="39" y="20">parser and policy</text></g>
    <g transform="translate(1383 372)"><rect class="check" width="27" height="27"/><path class="checkmark" d="M7 14l5 5L21 8"/><text x="39" y="20">actions and safety layer</text></g>
  </g>

  <rect class="panel" x="48" y="487" width="770" height="291"/>
  <text class="panel-title" x="74" y="526">3) Privacy-aware evidence</text>
  <g class="body">
    <circle class="accent" cx="89" cy="570" r="17"/><text class="num" x="89" y="571">1</text><text x="121" y="576">Minimize collection; encrypt sensitive evidence where needed.</text>
    <circle class="accent" cx="89" cy="622" r="17"/><text class="num" x="89" y="623">2</text><text x="121" y="628">Use field-level redaction and purpose-limited retention.</text>
    <circle class="accent" cx="89" cy="674" r="17"/><text class="num" x="89" y="675">3</text><text x="121" y="680">Protect the canonical reference and record the hashing method.</text>
    <rect x="76" y="702" width="711" height="59" rx="10" fill="#eef4ff" stroke="#91a8f5"/>
    <text class="label" x="431" y="726" text-anchor="middle"><tspan x="431">A digest supports comparison only with documented canonicalization</tspan><tspan x="431" dy="21">and a protected reference.</tspan></text>
  </g>

  <rect class="panel" x="842" y="487" width="782" height="291"/>
  <text class="panel-title" x="868" y="526">4) Operational rule</text>
  <text class="label" x="870" y="570">Design evidence before incidents.</text>
  <text class="body" x="870" y="606">If full prompt logging is restricted, preserve:</text>
  <g class="body">
    <circle cx="886" cy="643" r="6" fill="#315be8"/><text x="905" y="649">privacy-safe segment manifests and source references;</text>
    <circle cx="886" cy="683" r="6" fill="#315be8"/><text x="905" y="689">stable digests, lengths, token counts, and version identifiers;</text>
    <circle cx="886" cy="723" r="6" fill="#315be8"/><text x="905" y="729">authorization, parser, policy, approval, and action decisions.</text>
  </g>

  <rect class="warn" x="58" y="806" width="1556" height="98"/>
  <text class="warn-text" x="836" y="846" text-anchor="middle">Security consequence: design evidence before an incident and preserve the complete decision chain.</text>
  <text class="warn-text" x="836" y="878" text-anchor="middle">When prompts cannot be retained, use privacy-safe manifests, protected references, and explicit unknowns.</text>
</svg>
