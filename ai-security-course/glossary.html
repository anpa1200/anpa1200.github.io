  <div class="hero"><div class="wrap"><p class="eyebrow">Canonical course vocabulary</p><h1>AI, ML &amp; LLM Glossary</h1><p class="lead">The operational definitions used throughout AI Security Engineering. Search by term, abbreviation, concept, or definition. When a term is overloaded in industry, this glossary states the course meaning.</p></div></div>

  <script>
    const TERMS = [
      ["Activation function","Neural networks","A nonlinear function applied to a neuron's weighted input. It lets a neural network represent relationships more complex than a stack of linear operations."],
      ["Adapter","Models","A small set of trainable components added to a mostly frozen model to adapt it without updating every original parameter."],
      ["Adversarial example","AI security","An input intentionally modified to cause an ML model to make an attacker-chosen or incorrect prediction while often appearing normal to people."],
      ["Acceptable use","Governance","Documented boundaries for permitted users, purposes, data, models, tools, and actions. Acceptable-use rules are not a substitute for technical enforcement."],
      ["Agent","Agents","A system that uses a model to pursue a goal through a loop that may observe state, plan, select tools, act, evaluate results, and update memory. Autonomy and authority vary."],
      ["Agent loop","Agents","The repeated observe–reason or plan–act–observe cycle used by an agent until a stop condition, success, failure, or budget limit is reached."],
      ["AGI","Core AI","Artificial general intelligence: a contested, nonstandard threshold for broadly capable intelligence. The course does not assume present systems are AGI."],
      ["AI model","Core AI","A computational model used within an AI system to produce predictions, recommendations, decisions, representations, or generated content."],
      ["AI system","Core AI","A socio-technical system containing one or more models plus data, software, infrastructure, identities, people, processes, and downstream actions."],
      ["Alignment","Trustworthy AI","The effort to make system behavior conform to intended goals, instructions, values, policies, or preferences. Alignment is not equivalent to security."],
      ["Annotation","Data","Information added to data, often a label, span, rating, preference, or metadata, for training or evaluation."],
      ["Artificial intelligence (AI)","Core AI","A machine-based capability that produces predictions, recommendations, decisions, or content for human-defined objectives. AI is the broad field; ML is one approach within it."],
      ["Attention","Transformers","A mechanism that computes how strongly each representation should incorporate information from other positions. It produces weighted combinations of value vectors from query–key relevance."],
      ["Attention head","Transformers","One parallel instance of attention with its own learned projections. Multi-head attention lets a layer model different relationships simultaneously."],
      ["Artifact signing","Governance","A cryptographic signature over an artifact or metadata that supports integrity and publisher verification. Signing does not prove the artifact is safe."],
      ["Attestation","Governance","Evidence, often cryptographically verifiable, about how an artifact or workload was built, measured, configured, or executed."],
      ["Audit trail","Governance","A chronological, protected record of identities, events, decisions, changes, and outcomes that supports accountability and investigation."],
      ["Attack surface","AI security","All reachable components, interfaces, identities, data paths, dependencies, and actions an adversary may influence or abuse."],
      ["Autoregressive model","LLMs","A model that generates a sequence by predicting the next element from preceding elements, then feeding generated elements back into later predictions."],
      ["Backdoor","AI security","Hidden model behavior activated by a trigger and introduced through poisoned data, model modification, or a compromised artifact."],
      ["Backpropagation","Neural networks","The algorithm that propagates loss gradients backward through a differentiable computation graph so an optimizer can update parameters."],
      ["Blast radius","AI security","The scope of assets, identities, tenants, data, actions, or compute that can be affected after a component or credential is compromised."],
      ["Base model","Models","A model before task-specific or instruction-specific adaptation. The phrase is overloaded; always identify its exact checkpoint and training stage."],
      ["Batch","Training","A group of examples processed together for one training or inference step. Batch size affects memory, throughput, and optimization behavior."],
      ["Benchmark","Evaluation","A defined dataset, task, procedure, and metric used to compare systems. Benchmark performance is not automatically real-world or security assurance."],
      ["Bias (model parameter)","Training","An additive learned parameter in a model unit. Do not confuse this mathematical meaning with systematic social or statistical bias."],
      ["Bias (systematic error)","Trustworthy AI","A recurring skew in data, measurement, model behavior, or outcomes. This is an overloaded term and must be scoped."],
      ["Black-box access","AI security","Access limited to supplying inputs and observing outputs, without model parameters, gradients, code, or internal state."],
      ["Byte-pair encoding (BPE)","LLMs","A subword tokenization family that repeatedly merges frequent symbol pairs to create a vocabulary balancing common words and reusable fragments."],
      ["Calibration","Evaluation","The degree to which predicted confidence matches observed correctness. A calibrated 0.8 probability should be correct about 80% of comparable cases."],
      ["Causal language model","LLMs","A language model trained to predict tokens using only earlier tokens in the sequence. Most chat LLMs use a decoder-only causal architecture."],
      ["Checkpoint","Models","A saved state of model parameters and often optimizer or training metadata at a specific training or release point."],
      ["Chunk","RAG","A unit produced by splitting a source for indexing and retrieval. Chunk boundaries, overlap, metadata, and lineage affect relevance and security."],
      ["Citation precision","Evaluation","The proportion of generated citations that actually support the associated claim."],
      ["Citation recall","Evaluation","The proportion of source material relied upon by a response that is represented by citations."],
      ["Classification","Machine learning","A task that assigns an input to one or more discrete classes, such as malicious or benign."],
      ["Classifier","Machine learning","A model or system that performs classification. An LLM used to label text can act as a classifier but remains nondeterministic unless controlled."],
      ["Clustering","Machine learning","An unsupervised task that groups examples by similarity without predefined class labels."],
      ["Completion","LLMs","Generated continuation returned for an input context. Chat APIs typically transform messages into a model-specific completion context."],
      ["Computer vision (CV)","Core AI","The field concerned with extracting representations, predictions, or generated content from images and video."],
      ["Confidentiality","AI security","The property that information is not disclosed to unauthorized entities. In AI systems this includes prompts, data, embeddings, weights, memory, logs, and secrets."],
      ["Context","LLMs","The tokens and other model inputs available for the current computation. Context can contain instructions, user data, retrieved content, tool definitions, and conversation history."],
      ["Context engineering","LLMs","Designing and controlling the complete information supplied to a model—including instructions, retrieval, tools, memory, examples, and state—not merely wording one prompt."],
      ["Context window","LLMs","The maximum model-specific sequence length available for input and often generated output. Effective usable context can be smaller than the advertised limit."],
      ["Cache isolation","AI security","Controls that prevent cached prompts, key-value states, embeddings, results, or responses from crossing users, tenants, models, or authorization contexts."],
      ["Convolutional neural network (CNN)","Neural networks","A neural-network family using learned filters with shared weights, historically dominant in vision and spatial tasks."],
      ["Corpus","Data","A collection of text, documents, or other language data used for training, analysis, or retrieval."],
      ["Cross-entropy loss","Training","A loss commonly used for classification and next-token prediction that penalizes probability assigned away from the correct target."],
      ["Data drift","Operations","A change over time in the distribution of production inputs compared with training or earlier operational data."],
      ["Data poisoning","AI security","Intentional manipulation of training, fine-tuning, feedback, or retrieval data to alter model or system behavior."],
      ["Data provenance","Data","Traceable information about a data item's origin, custody, transformations, versions, permissions, and use."],
      ["Data split","Training","A partition of examples into training, validation, test, and sometimes calibration sets with leakage controls."],
      ["Dataset","Data","A defined collection of examples and associated labels or metadata used for training, adaptation, evaluation, or operation."],
      ["Decoder","Transformers","A Transformer component that generates output representations, typically with causal masking for autoregressive language generation."],
      ["Decoding","LLMs","The procedure for selecting output tokens from model logits or probabilities, such as greedy decoding, beam search, temperature sampling, top-k, or top-p."],
      ["Deep learning","Core AI","Machine learning based on neural networks with multiple representation-learning layers. Deep learning is a subset of ML."],
      ["Denial of wallet","AI security","Resource or cost abuse that causes unexpected financial consumption through model inference, tokens, tools, storage, or cloud compute."],
      ["Dense retrieval","RAG","Retrieval using learned vector embeddings and a similarity measure rather than exact lexical term matching."],
      ["Deterministic","Core AI","Producing the same output for the same complete input and state. Many LLM APIs are not guaranteed deterministic even with low temperature."],
      ["Differential privacy (DP)","Privacy","A formal privacy framework that bounds how much an output distribution can change when one individual's record is added or removed."],
      ["Discriminative model","Models","A model that estimates classes, scores, boundaries, or other decisions rather than primarily generating new samples. The term is a family description, not a security property."],
      ["Diffusion model","Models","A generative model trained to reverse a gradual noising process, widely used for image, audio, and video generation."],
      ["Dimensionality","Data","The number of coordinates or features in a representation, such as the length of an embedding vector."],
      ["Direct Preference Optimization (DPO)","Training","A preference-training method that directly optimizes a policy from preferred and rejected responses without a separate reinforcement-learning loop."],
      ["Distillation","Training","Training a smaller student model to reproduce selected behavior or distributions of a larger teacher model."],
      ["Distribution shift","Operations","A mismatch between training and deployment distributions. Data drift, concept drift, and adversarial manipulation can create shift."],
      ["Dropout","Training","A regularization method that randomly disables units during training to reduce dependence on specific pathways."],
      ["Early stopping","Training","Stopping training when validation performance ceases improving to reduce overfitting and wasted computation."],
      ["Embedding","Models","A learned numeric vector representing an item so relevant relationships can be measured in a vector space. Embeddings can leak or encode sensitive attributes."],
      ["Embedding model","RAG","A model that converts text, images, or other objects into vectors for retrieval, clustering, similarity, or downstream features."],
      ["Encoder","Transformers","A Transformer component that builds contextual representations from an input sequence, usually using bidirectional attention."],
      ["Encoder–decoder model","Transformers","A Transformer architecture where an encoder represents input and a decoder generates output while attending to encoder states."],
      ["Epoch","Training","One complete pass through the training dataset, subject to batching and sampling choices."],
      ["Egress","AI security","Outbound data movement from a system or component. AI applications require explicit destination, protocol, content, and identity controls."],
      ["Encoder model","Models","A model or architecture that transforms input into contextual representations, often for classification, retrieval, or embeddings rather than autoregressive generation."],
      ["Evaluation (eval)","Evaluation","A defined process for measuring a model or system against tasks, datasets, criteria, scorers, and acceptance thresholds."],
      ["Evasion attack","AI security","An inference-time attack that modifies input to cause a target model to misclassify, miss, or produce an attacker-desired output."],
      ["Excessive agency","AI security","Risk created when an AI component can perform more actions, with more permissions or autonomy, than required for its task."],
      ["Explainability","Trustworthy AI","Methods or properties that communicate why a system produced an output. Explanations may be approximate and are not automatically faithful."],
      ["Exposure bias","LLMs","The train–generation mismatch created when a sequence model trains on true previous tokens but generates from its own earlier outputs."],
      ["F1 score","Evaluation","The harmonic mean of precision and recall. It hides class-specific and threshold details unless those are reported."],
      ["False negative (FN)","Evaluation","A positive case incorrectly predicted as negative, such as malicious activity missed by a detector."],
      ["False positive (FP)","Evaluation","A negative case incorrectly predicted as positive, such as benign activity incorrectly alerted."],
      ["Feature","Machine learning","An input variable or derived representation supplied to a model."],
      ["Feature engineering","Machine learning","Selecting, transforming, or constructing input variables to improve learning, performance, or interpretability."],
      ["Few-shot prompting","LLMs","Providing a small number of input–output examples in context to demonstrate the desired task or format without updating model weights."],
      ["Fine-tuning","Training","Continuing training from a pretrained checkpoint on a smaller task, domain, instruction, or preference dataset."],
      ["Foundation model","Models","A broadly capable model trained on large and diverse data that can be adapted to many downstream tasks."],
      ["Forward pass","Neural networks","Computing model outputs from inputs through the model's current parameters without updating those parameters."],
      ["Function calling","Agents","A model/API pattern that produces a structured request to invoke a named function. The application must validate and authorize the call outside the model."],
      ["Generative model","Models","A model that learns a distribution or generation process for producing new samples, sequences, or content. Generative does not mean safe or broadly reusable."],
      ["Generalization","Evaluation","The ability to perform on relevant unseen examples or conditions rather than only memorizing training data."],
      ["Generative AI","Core AI","AI models and systems that generate new content such as text, code, images, audio, video, or structured data."],
      ["Gradient","Training","The vector of partial derivatives of an objective with respect to parameters, indicating the local direction and magnitude of change."],
      ["Gradient descent","Training","An optimization family that updates parameters in a direction intended to reduce loss, commonly through stochastic variants."],
      ["Grounding","RAG","Constraining or informing generation with specified external evidence, data, tools, or state. Grounding reduces some errors but does not guarantee truth."],
      ["Guardrail","AI security","An overloaded marketing term for a preventive or detective constraint around model input, output, actions, or use. Always name the actual mechanism and boundary."],
      ["Hallucination","LLMs","Generated content that is unsupported, incorrect, or fabricated but presented as if valid. The term describes an output failure, not a diagnosis of model intent."],
      ["Hidden layer","Neural networks","A neural-network layer between input and output whose learned representations are not directly observed as task outputs."],
      ["Human-in-the-loop (HITL)","Agents","A workflow requiring meaningful human input or approval at specified points. A generic confirmation dialog is not necessarily an effective control."],
      ["Hyperparameter","Training","A configuration chosen outside ordinary parameter learning, such as learning rate, batch size, architecture depth, or regularization strength."],
      ["Indirect prompt injection","AI security","Instructions embedded in external content that enter model context through retrieval, browsing, messages, tool results, or other data paths."],
      ["Inference","Models","Using trained parameters to compute predictions, representations, recommendations, or generated outputs from new input."],
      ["Inference API","Operations","A network or local programming interface that accepts model inputs and returns inference outputs, often with routing, quotas, logging, and policy."],
      ["Incident response","AI security","The process of preparing for, detecting, containing, investigating, eradicating, recovering from, and learning from a security incident affecting an AI system."],
      ["Instruction tuning","Training","Fine-tuning on instruction–response examples to improve following natural-language tasks and formats."],
      ["Integrity","AI security","The property that data, models, configuration, outputs, decisions, and actions are accurate and protected from unauthorized alteration."],
      ["Interpretability","Trustworthy AI","The degree to which people can understand model mechanisms or input–output relationships. It overlaps with but is not identical to explainability."],
      ["Jailbreak","AI security","An input strategy intended to bypass model behavior restrictions or safety policies. A jailbreak is not necessarily a security exploit unless connected to assets or authority."],
      ["Least privilege","AI security","Giving an identity, tool, process, model, or workload only the authority required for its defined task and no broader access."],
      ["Judge model / LLM-as-a-judge","Evaluation","A model used to score other model outputs. It can introduce bias, inconsistency, prompt sensitivity, leakage, and correlated failure."],
      ["Knowledge base","RAG","A managed collection of information used for search, retrieval, reasoning, or generation. It may contain documents, records, graphs, or structured data."],
      ["Label","Data","A target value or annotation associated with an example for supervised learning or evaluation."],
      ["Language model","LLMs","A model that estimates probabilities over tokens or token sequences. Not every NLP model is a language model."],
      ["Large language model (LLM)","LLMs","A high-parameter language model, usually Transformer-based and pretrained on large corpora, that can perform or support many language tasks."],
      ["Latent space","Models","A learned representation space in which inputs or generated states are encoded as vectors. The term is overloaded across model families."],
      ["Layer","Neural networks","A stage of learned or fixed computation that transforms one representation into another."],
      ["Learning rate","Training","A hyperparameter controlling the size of optimizer updates. Too high may destabilize training; too low may slow or stall learning."],
      ["Logit","LLMs","A model's raw, unnormalized score for a possible output class or token before softmax or another normalization."],
      ["LoRA","Training","Low-Rank Adaptation: a parameter-efficient fine-tuning method that learns low-rank update matrices while the base weights remain mostly frozen."],
      ["Loss function","Training","A differentiable objective that quantifies training error or preference and guides parameter updates."],
      ["Machine learning (ML)","Core AI","A set of methods that learn model behavior or parameters from data or experience instead of expressing all behavior as explicit rules."],
      ["Membership inference","AI security","Inferring whether a particular record was included in a model's training data."],
      ["Memory (agent)","Agents","State retained or retrieved across agent steps or sessions. It may be short-term context, persisted records, summaries, or vector-retrieved history."],
      ["Metric","Evaluation","A defined quantitative measure. A metric is meaningful only with its dataset, threshold, aggregation, and operational context."],
      ["MLOps","Operations","Practices and systems for developing, testing, versioning, deploying, monitoring, and governing ML models and data in production."],
      ["Model","Models","A parameterized computational representation that maps input to output. In casual speech, 'model' is often incorrectly used for the entire AI system."],
      ["Model card","Governance","Documentation describing a model's intended uses, training or evaluation information, limitations, risks, and other release-relevant facts."],
      ["Model Context Protocol (MCP)","Agents","A client-server protocol for connecting AI applications to tools, resources, prompts, and related capabilities using a defined data and transport architecture."],
      ["Model extraction","AI security","Reconstructing or approximating a target model's parameters, decision behavior, or functionality through queries, artifacts, or internal access."],
      ["Model inversion","AI security","Inferring representative or sensitive properties of training data from model access and outputs."],
      ["Model registry","Operations","A controlled catalog of model artifacts, versions, metadata, approvals, stages, and deployment status."],
      ["Model serving","Operations","Infrastructure and software that load models and expose inference while managing scaling, batching, routing, hardware, policy, and telemetry."],
      ["Modality","Models","A type of information such as text, image, audio, video, sensor data, or structured records."],
      ["Multimodal model","Models","A model that accepts or produces more than one modality, such as text and images."],
      ["Natural language processing (NLP)","Core AI","The field concerned with computational representation, understanding, transformation, and generation of human language."],
      ["Neural network","Neural networks","A parameterized model composed of connected layers that transform inputs through learned weights, biases, and nonlinear functions."],
      ["Next-token prediction","LLMs","The training or inference task of predicting a probability distribution over the next token given preceding context."],
      ["Node / neuron / unit","Neural networks","A computational element that combines inputs and parameters and usually applies an activation function. Terminology varies by architecture."],
      ["Objective function","Training","The quantity an optimization process seeks to minimize or maximize. It may combine primary loss, regularization, reward, or constraints."],
      ["One-shot prompting","LLMs","Providing one example in context before requesting a new response."],
      ["Optimizer","Training","An algorithm such as SGD or Adam that uses gradients and internal state to update parameters."],
      ["Overfitting","Evaluation","Learning training-specific patterns that do not generalize to relevant unseen data."],
      ["Parameter","Models","A numeric value learned during training, such as a weight or bias. Parameter count is an incomplete proxy for capability."],
      ["Parameter-efficient fine-tuning (PEFT)","Training","Adaptation methods that train a small subset or additional parameters rather than all base-model weights."],
      ["Perplexity","Evaluation","An exponentiated average language-model loss reflecting how surprised the model is by a token sequence. Lower is better only for comparable data and tokenization."],
      ["Precision","Evaluation","Among predicted positives, the fraction that are actually positive: TP/(TP+FP). Also an overloaded term for numeric data type, such as FP16."],
      ["Pre-training","Training","Initial large-scale training that learns broad representations or next-token behavior before narrower adaptation."],
      ["Prompt","LLMs","Input supplied to a model for a generation or prediction. It may contain instructions, data, examples, tool definitions, retrieved content, and state."],
      ["Prompt engineering","LLMs","Designing prompts to elicit useful behavior. It improves interaction quality but is not an authorization or security boundary."],
      ["Prompt injection","AI security","An attempt to make model-controlled behavior follow attacker-supplied instructions that conflict with the application's intended instruction hierarchy or policy."],
      ["Prompt template","LLMs","A versioned structure that combines fixed instructions and variable data into model input."],
      ["Provenance","Governance","Traceable information about origin, ownership, transformations, versions, custody, and approvals for data, models, prompts, content, or actions."],
      ["Quantization","Operations","Representing model weights or activations with lower numeric precision to reduce memory, cost, or latency, sometimes with quality trade-offs."],
      ["Query","RAG","A representation of an information need sent to a search or retrieval system. It may be the user text, a rewrite, decomposition, or embedding."],
      ["Recall","Evaluation","Among actual positives, the fraction correctly predicted: TP/(TP+FN). In retrieval, the fraction of relevant items retrieved."],
      ["Regression","Machine learning","A task that predicts a continuous numeric value."],
      ["Regularization","Training","Methods that constrain learning to improve generalization, such as weight decay, dropout, or data augmentation."],
      ["Reinforcement learning (RL)","Machine learning","Learning a policy through interaction using states, actions, rewards, and returns rather than fixed labels alone."],
      ["Reranker","RAG","A model or rule that reorders retrieved candidates using a more precise relevance estimate after initial retrieval."],
      ["Representation","Models","A numeric encoding of an input, intermediate state, or concept used by a model."],
      ["Retrieval-augmented generation (RAG)","RAG","A system pattern that retrieves external information and supplies it to a generative model so output can use non-parametric knowledge."],
      ["Reward model","Training","A model trained to estimate preference or quality and provide a reward signal for policy optimization or ranking."],
      ["RLHF","Training","Reinforcement Learning from Human Feedback: training a policy using preferences or feedback, typically involving a reward model and RL optimization."],
      ["Robustness","Trustworthy AI","The ability to maintain acceptable behavior under expected variation, errors, stress, or attack. Robustness must be scoped and measured."],
      ["Safety","Trustworthy AI","Freedom from unacceptable harm. Safety overlaps with security but includes harms not caused by an adversary."],
      ["Sampling","LLMs","Selecting outputs from a probability distribution. In MCP, sampling is also a protocol feature by which servers request model completions from a client; state the meaning."],
      ["Self-attention","Transformers","Attention where queries, keys, and values are derived from positions in the same sequence."],
      ["Self-supervised learning","Machine learning","Learning targets from the structure of unlabeled data itself, such as predicting masked or next tokens."],
      ["Semantic search","RAG","Retrieval based on meaning-oriented representations, usually embeddings, rather than exact keyword matching alone."],
      ["Semi-supervised learning","Machine learning","Training that combines a smaller labeled dataset with a larger unlabeled dataset."],
      ["Sequence","LLMs","An ordered collection of tokens or other elements processed as a unit."],
      ["Sparse retrieval","RAG","Retrieval using sparse lexical representations, such as term-frequency methods, where most vector dimensions are zero."],
      ["Softmax","Neural networks","A function that converts a vector of logits into normalized positive values summing to one, often interpreted as a categorical distribution."],
      ["Supervised fine-tuning (SFT)","Training","Fine-tuning on curated input–desired-output examples, often used to make pretrained LLMs follow instructions."],
      ["Supervised learning","Machine learning","Learning a mapping from inputs to known target labels or values."],
      ["System prompt","LLMs","Application-supplied instructions intended to guide model behavior. It is part of model context, not a secret store or deterministic policy boundary."],
      ["Temperature","LLMs","A decoding parameter that rescales logits before sampling. Higher values generally flatten the distribution; zero does not guarantee platform-level determinism."],
      ["Telemetry","Operations","Recorded signals describing system state and behavior, including inputs, versions, retrieval, policy decisions, tools, identities, egress, performance, and outcomes."],
      ["Tensor","Neural networks","A multidimensional array used to represent data, parameters, activations, and gradients."],
      ["Test set","Evaluation","A held-out dataset used for final evaluation after model and hyperparameter choices. Repeated tuning on it contaminates the estimate."],
      ["Token","LLMs","A vocabulary unit processed by a language model. A token may be a word, subword, byte, punctuation mark, or special control symbol."],
      ["Tokenizer","LLMs","The versioned algorithm and vocabulary that convert raw input to token IDs and token IDs back to text or other units."],
      ["Tool","Agents","A function or capability exposed to an AI application to retrieve information or change state. Tool execution must be authorized outside the model."],
      ["Tool calling","Agents","The process of selecting a tool and producing structured arguments for execution. The model proposes; application controls must validate and authorize."],
      ["Top-k sampling","LLMs","Sampling restricted to the k tokens with highest current probability."],
      ["Top-p / nucleus sampling","LLMs","Sampling from the smallest set of tokens whose cumulative probability reaches a threshold p."],
      ["Training","Training","The process of adjusting model parameters to optimize an objective using data, feedback, or interaction."],
      ["Training data","Data","Data used to learn model parameters. It is distinct from validation, test, retrieval, and production input data."],
      ["Transformer","Transformers","A neural-network architecture built primarily from attention and feed-forward layers that processes token representations in parallel during training."],
      ["Trust boundary","AI security","A point where data, identity, authority, ownership, or assurance level changes and controls must validate the transition."],
      ["Underfitting","Evaluation","Failure to learn enough structure to perform adequately even on the training objective or relevant validation data."],
      ["Unsupervised learning","Machine learning","Learning patterns or structure from data without explicit target labels, such as clustering or dimensionality reduction."],
      ["Validation set","Evaluation","Data used during development for model selection, thresholding, early stopping, or hyperparameter tuning."],
      ["Vector database","RAG","A database product designed to store, index, filter, and search vectors with associated metadata. The term is often used loosely."],
      ["Vector store","RAG","A component that stores vectors and supports similarity retrieval, often with metadata filtering. It may be a feature of a general database."],
      ["Weight","Models","A learned parameter multiplying or transforming model activations. Model weights are security-sensitive intellectual property and executable inputs to a runtime."],
      ["AI flight recorder","Operations","A protected event record linking identity, tenant, model, prompt, retrieval, tools, policy decisions, memory, egress, and outcomes for detection and reconstruction."],
      ["AI bill of materials (AIBOM)","Governance","An inventory of models, datasets, adapters, prompts, dependencies, runtimes, tools, and provenance associated with an AI system or release."],
      ["Authorization correctness","Evaluation","Whether every retrieval, tool call, and state-changing action is permitted for the initiating identity, tenant, context, and policy."],
      ["Data minimization","Privacy","Collecting, retaining, and exposing only the data necessary for a defined purpose and period."],
      ["Groundedness","Evaluation","The degree to which generated claims are supported by the supplied evidence or authoritative context. Groundedness is not the same as truth or authorization."],
      ["Key-value cache (KV cache)","Operations","Cached attention keys and values reused across autoregressive generation. Cache ownership, lifecycle, isolation, and eviction can affect confidentiality and availability."],
      ["Mean reciprocal rank (MRR)","Evaluation","A retrieval metric that averages the reciprocal rank of the first relevant result. It does not measure authorization correctness or complete recall."],
      ["Model cache","Operations","Stored model weights, compiled artifacts, or runtime data reused to reduce loading cost. Cache integrity, provenance, and tenant isolation must be controlled."],
      ["Output encoding","AI security","Converting output into a safe representation for its destination, such as HTML, SQL, shell, or a URL context. Encoding is destination-specific and not a substitute for authorization."],
      ["Personally identifiable information (PII)","Privacy","Information that identifies or can reasonably be linked to an individual. AI prompts, training data, retrieval content, and logs may contain PII."],
      ["Prompt cache","Operations","A cache of reusable prompt prefixes or prompt-derived computation. Cache keys and authorization context must prevent cross-tenant disclosure."],
      ["Rate limiting","AI security","Restricting request, token, tool, data, or cost volume over an identity, tenant, resource, or period to reduce abuse and availability impact."],
      ["Red teaming","AI security","Authorized adversarial testing designed to discover and validate security, safety, privacy, abuse, or resilience weaknesses under defined rules of engagement."],
      ["Re-identification","Privacy","Linking de-identified, pseudonymized, or aggregated information with other data to infer an individual's identity."],
      ["Retention","Governance","The policy and technical behavior governing how long data, prompts, outputs, logs, embeddings, memory, and artifacts are kept and when they are deleted."],
      ["Risk register","Governance","A maintained record of identified risks, causes, assets, owners, likelihood or confidence, impact, controls, treatment, and residual risk."],
      ["Safety regression","Evaluation","A measurable degradation in previously accepted safety behavior after a model, adapter, prompt, data, tool, policy, or runtime change."],
      ["Sandboxing","AI security","Isolating code, models, tools, or artifacts with restricted identities, filesystem, network, compute, and data access to limit compromise impact."],
      ["Scoped credentials","Identity","Credentials limited by identity, tenant, resource, action, audience, purpose, or expiry rather than broad reusable authority."],
      ["Semantic cache","Operations","A cache that reuses results for semantically similar requests. Similarity keys must include authorization and data-sensitivity context where required."],
      ["Server-side request forgery (SSRF)","AI security","A vulnerability in which an application is induced to make network requests chosen by an attacker, potentially reaching internal services or metadata endpoints."],
      ["Token scoping","Identity","Restricting a token’s permissions, audience, resources, operations, and lifetime to the smallest required authority."],
      ["Workload identity","Identity","An identity assigned to a running service, job, container, model runner, or agent workload so its actions can be authorized and attributed separately from a human user."],
      ["Output sanitization","AI security","Removing, escaping, validating, or rejecting unsafe content before it reaches a parser, renderer, interpreter, tool, or downstream system. Sanitization must match the destination."],
      ["White-box access","AI security","Access to model internals such as parameters, architecture, gradients, code, or training details."],
      ["Zero-shot prompting","LLMs","Requesting a task without providing task-specific examples in the current prompt."],
      ["Availability","AI security","The property that systems and resources remain accessible and usable as required, including compute, model endpoints, retrieval, tools, and budgets."],
      ["Concept drift","Operations","A change in the relationship between inputs and the desired target or outcome over time."],
      ["Data leakage (ML evaluation)","Evaluation","Information from validation, test, future, or target data improperly influencing training or feature construction, inflating performance estimates."],
      ["Data leakage (security)","AI security","Unauthorized disclosure of data. Because the term is overloaded, state whether you mean evaluation contamination or confidentiality loss."],
      ["Model drift","Operations","A change in production model performance or behavior over time due to data, environment, dependencies, or system changes."],
      ["Prompt leakage","AI security","Disclosure of hidden or application-supplied prompt content. Prompts must not be treated as secret storage."],
      ["Tenant isolation","AI security","Controls that prevent one customer, organization, or security domain from accessing or influencing another tenant's data, memory, tools, identity, or compute."],
      ["Threat model","AI security","A structured representation of assets, actors, goals, trust boundaries, assumptions, attack paths, controls, and residual risks for a defined system."],
      ["True negative (TN)","Evaluation","A negative case correctly predicted as negative."],
      ["True positive (TP)","Evaluation","A positive case correctly predicted as positive."]
    ];
    const categories = ["All", ...new Set(TERMS.map(t => t[1]))].sort((a,b)=>a==="All"?-1:a.localeCompare(b));
    let active = "All";
    const search = document.getElementById("search"), root = document.getElementById("glossary"), count = document.getElementById("count"), filters = document.getElementById("filters");
    function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
    function renderFilters(){filters.innerHTML=categories.map(c=>`<button class="filter ${c===active?"active":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");filters.querySelectorAll("button").forEach(b=>b.onclick=()=>{active=b.dataset.cat;renderFilters();render();});}
    function render(){const q=search.value.trim().toLowerCase();const found=TERMS.filter(t=>(active==="All"||t[1]===active)&&(!q||t.join(" ").toLowerCase().includes(q))).sort((a,b)=>a[0].localeCompare(b[0]));count.textContent=`${found.length} of ${TERMS.length} terms`;if(!found.length){root.innerHTML='<p class="empty">No matching terminology.</p>';return;}let html="",letter="";for(const t of found){const l=t[0][0].toUpperCase();if(l!==letter){if(letter)html+="</div>";letter=l;html+=`<h2 class="letter">${l}</h2><div class="terms">`;}html+=`<article class="term"><h3>${esc(t[0])}</h3><p>${esc(t[2])}</p><span class="cat">${esc(t[1])}</span></article>`;}root.innerHTML=html+"</div>";}
    search.addEventListener("input",render);renderFilters();render();
  </script>
