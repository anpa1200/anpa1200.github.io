[allowlist]
description = "Documented non-secret placeholders in generated research examples"
stopwords = ["<snip>"]
# Reviewed non-secret evidence: source-file SHA-256 digests and DNS CNAME lists.
# Keep credential-bearing query parameters redacted instead of allowlisting them.
regexTarget = "match"
regexes = [
  '''(?:openapi|auth)\.py": "[a-f0-9]{64}"''',
  '''\b[a-z0-9.-]+\.edgekey\.net,(?:[a-z0-9-]+\.)+[a-z0-9.,-]+"''',
]
