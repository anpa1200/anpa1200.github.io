[allowlist]
description = "Documented non-secret placeholders in generated research examples"
stopwords = ["<snip>"]
# Reviewed non-secret evidence: source-file SHA-256 digests and DNS CNAME lists.
# Keep credential-bearing query parameters redacted instead of allowlisting them.
regexTarget = "match"
regexes = [
  # Exact public GitHub audit fixture token digest; not an authentication token.
  '''hashed_token":"E8Fzcgs3TQXqhrKKC/qNR\+2XZnaK3ykQBSAt1kPMiJs="''',
  '''(?:openapi|auth)\.py": "[a-f0-9]{64}"''',
  '''\b[a-z0-9.-]+\.edgekey\.net,(?:[a-z0-9-]+\.)+[a-z0-9.,-]+"''',
  # Public training-machine identities, not NTLM passwords or response material.
  '''ntlmssp\.auth\.hostname": "(?:GILBERT|TUCKER)-WIN7-PC"''',
]
