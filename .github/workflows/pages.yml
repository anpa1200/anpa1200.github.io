name: Validate and deploy Cloudflare Static Assets

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  repository_dispatch:
    types: [rebuild-search]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ARTICLE_ARCHIVE_COMMIT: a94750828ed75dbce4c1e9a9f4ea1994fa785943

jobs:
  quality:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    outputs:
      static-artifact-id: ${{ steps.static-artifact.outputs.artifact-id }}
    steps:
      # fetch-depth: 0 (full history) is required here, not cosmetic: both
      # build-content-catalog.mjs and build-site-artifacts.mjs date pages via
      # `git log -1 -- <path>`. With the default shallow (depth-1) checkout,
      # git has no prior commits to compare against, so it silently returns
      # the single checked-out commit's own date for every tracked file
      # instead of each file's real last-changed date. That makes the
      # committed content-catalog.json "stale" relative to a fresh rebuild on
      # almost every PR that touches it, since the date it would recompute
      # depends on which exact commit is being tested rather than on the
      # file's actual history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked search tooling
        run: npm ci
      - name: Audit dependency graph
        run: npm audit --package-lock-only --audit-level=high
      - name: Validate search source
        run: npm run check-release-source
      - name: Validate isolated Static Assets Worker and hosting invariants
        run: |
          npm run check-site-worker
          npm ci --prefix cloudflare
          npm audit --prefix cloudflare --package-lock-only --audit-level=high
          npm run check-site-worker:runtime
      - name: Validate reviewed anomaly navigation
        run: |
          npm run check-anomaly-tags
          node scripts/build-anomaly-atlas-integration.mjs --check
      - name: Stage publishable site
        run: |
          mkdir -p "${RUNNER_TEMP}/site"
          git archive --format=tar --output="${RUNNER_TEMP}/site.tar" HEAD
          tar --extract --file="${RUNNER_TEMP}/site.tar" --directory="${RUNNER_TEMP}/site" \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='cloudflare' \
            --exclude='node_modules' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='scripts' \
            --exclude='tests' \
            --exclude='content' \
            --exclude='reports/site-audit-20260909' \
            --exclude='reports/second-remediation-20260909'
          npm run build-shell -- --site "${RUNNER_TEMP}/site"
          npm run build-ai-discovery -- --site "${RUNNER_TEMP}/site"
          node scripts/inject-search-loader.mjs --site "${RUNNER_TEMP}/site"
      - name: Checkout canonical article archive source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: anpa1200/medium-blog-navigation
          ref: ${{ env.ARTICLE_ARCHIVE_COMMIT }}
          path: .article-archive-source
      - name: Align archive source URL policy
        run: node scripts/prepare-article-archive.mjs --archive .article-archive-source
      - name: Build and stage canonical article archive
        working-directory: .article-archive-source
        run: |
          npm ci
          npm audit --package-lock-only --audit-level=critical
          npm run validate:archive
          npm run validate:media:local
          npm run build:embedded
          node --test tests/big-pharma-publication.test.mjs
          mkdir -p "${RUNNER_TEMP}/site/articles"
          cp -a build/. "${RUNNER_TEMP}/site/articles/"
      - name: Stage and verify article governance data
        run: >-
          node scripts/stage-article-archive-governance.mjs
          --site "${RUNNER_TEMP}/site"
          --source "${GITHUB_WORKSPACE}"
          --archive "${GITHUB_WORKSPACE}/.article-archive-source"
          --archive-commit "${ARTICLE_ARCHIVE_COMMIT}"
      - name: Build and stage pinned companion publications
        run: |
          node scripts/stage-companion-sites.mjs --site "${RUNNER_TEMP}/site"
          node scripts/normalize-platform-assets.mjs --site "${RUNNER_TEMP}/site"
      - name: Integrate searchable TTP modules and article backlinks
        run: |
          node scripts/build-ttp-integration.mjs --site "${RUNNER_TEMP}/site" --require-archive
          node scripts/build-anomaly-atlas-integration.mjs --site "${RUNNER_TEMP}/site" --require-archive
          node scripts/inject-search-loader.mjs --site "${RUNNER_TEMP}/site"
      - name: Build canonical metadata and release HTML
        run: npm run build-metadata:remote -- --site "${RUNNER_TEMP}/site" --source "${GITHUB_WORKSPACE}"
      - name: Integrate governed platform sidebar
        run: npm run build-sidebar -- --site "${RUNNER_TEMP}/site"
      - name: Compact shared UI scripts without changing research data
        run: node scripts/build-release-js.mjs --site "${RUNNER_TEMP}/site"
      - name: Validate complete staged site
        run: |
          npm run check-semantics -- --site "${RUNNER_TEMP}/site"
          npm run check-facts -- --site "${RUNNER_TEMP}/site"
          npm run check-seo -- --site "${RUNNER_TEMP}/site" --require-release-transform
          npm run check-links -- --site "${RUNNER_TEMP}/site"
      - name: Build deployable domain content catalogue
        run: >-
          npm run build-content:remote --
          --site "${RUNNER_TEMP}/site"
          --source "${GITHUB_WORKSPACE}"
          --sitemap "${RUNNER_TEMP}/site/sitemap.xml"
      - name: Build complete article and guide reference library
        run: |
          node scripts/build-site-reference-library.mjs --site "${RUNNER_TEMP}/site" --source "${GITHUB_WORKSPACE}"
          node scripts/build-reference-library.mjs --site "${RUNNER_TEMP}/site"
          npm run build-metadata:remote -- --site "${RUNNER_TEMP}/site" --source "${GITHUB_WORKSPACE}"
          npm run build-sidebar -- --site "${RUNNER_TEMP}/site"
          npm run build-content:remote -- \
            --site "${RUNNER_TEMP}/site" \
            --source "${GITHUB_WORKSPACE}" \
            --sitemap "${RUNNER_TEMP}/site/sitemap.xml"
      - name: Audit platform discoverability, taxonomy, and sidebar coverage
        run: >-
          npm run check-discoverability --
          --site "${RUNNER_TEMP}/site"
          --report "${RUNNER_TEMP}/platform-discoverability.json"
      - name: Apply governed article lifecycle notices
        run: npm run build-lifecycle-banners -- --site "${RUNNER_TEMP}/site"
      - name: Build canonical domain-wide search index
        run: >-
          npm run build-search:remote --
          --site "${RUNNER_TEMP}/site"
          --sitemap "${RUNNER_TEMP}/site/sitemap.xml"
          --output "${RUNNER_TEMP}/site/pagefind"
          --canonical-sitemap-output "${RUNNER_TEMP}/site/sitemap.xml"
          --max-stale-pages 0
      - name: Validate search coverage and ranking
        run: |
          node scripts/check-content-schema.mjs --site "${RUNNER_TEMP}/site"
          node scripts/check-content-catalog.mjs --site "${RUNNER_TEMP}/site"
          npm run check-search:index -- --bundle "${RUNNER_TEMP}/site/pagefind" --remote
      - name: Browser smoke test search and autocomplete
        run: npm run check-search:browser -- --site "${RUNNER_TEMP}/site" --bundle "${RUNNER_TEMP}/site/pagefind"
      - name: Validate attack and detection modules, tags and hydrated guide backlinks
        run: >-
          node scripts/check-ttp-browser.mjs
          --site "${RUNNER_TEMP}/site"
          --report-dir "${RUNNER_TEMP}/ttp-module-browser"
      - name: Validate interactive ATT&CK and ATLAS matrix
        run: >-
          node scripts/check-interactive-matrix-browser.mjs
          --site "${RUNNER_TEMP}/site"
          --report-dir "${RUNNER_TEMP}/interactive-matrix-browser"
      - name: Validate every TTP workbook at mobile and desktop widths
        run: >-
          node scripts/check-ttp-workbooks-browser.mjs
          --site "${RUNNER_TEMP}/site"
          --report-dir "${RUNNER_TEMP}/ttp-workbook-browser"
      - name: Browser mobile typography and overflow regression
        run: >-
          npm run check-layout:browser --
          --site "${RUNNER_TEMP}/site"
          --screenshots "${RUNNER_TEMP}/mobile-layout"
      - name: Browser accessibility and performance regression
        run: >-
          npm run check-quality:browser --
          --site "${RUNNER_TEMP}/site"
          --report "${RUNNER_TEMP}/browser-quality.json"
      - name: Validate Big Pharma article images, mobile layout, and accessibility
        run: >-
          node scripts/check-big-pharma-browser.mjs
          --site "${RUNNER_TEMP}/site"
          --archive "${RUNNER_TEMP}/site/articles"
      - name: Validate deployable-file hygiene
        run: npm run check-hygiene -- --site "${RUNNER_TEMP}/site"
      - name: Revalidate published sitemap and metadata
        run: |
          npm run check-semantics -- --site "${RUNNER_TEMP}/site"
          npm run check-facts -- --site "${RUNNER_TEMP}/site"
          node scripts/check-content-schema.mjs --site "${RUNNER_TEMP}/site"
          node scripts/check-content-catalog.mjs --site "${RUNNER_TEMP}/site"
          npm run check-seo -- --site "${RUNNER_TEMP}/site" --require-release-transform --require-catalog-agreement
          npm run check-links -- --site "${RUNNER_TEMP}/site"
      - name: Emit and validate immutable build identity
        run: |
          node scripts/check-companion-coverage.mjs --site "${RUNNER_TEMP}/site"
          npm run build-identity -- \
            --site "${RUNNER_TEMP}/site" \
            --site-commit "${GITHUB_SHA}" \
            --archive-commit "${ARTICLE_ARCHIVE_COMMIT}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm run check-build-identity -- --site "${RUNNER_TEMP}/site" --site-commit "${GITHUB_SHA}"
          npm run check-hygiene -- --site "${RUNNER_TEMP}/site"
      - name: Preserve quality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site-quality-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mobile-layout
            ${{ runner.temp }}/browser-quality.json
            ${{ runner.temp }}/ttp-module-browser
            ${{ runner.temp }}/interactive-matrix-browser
            ${{ runner.temp }}/ttp-workbook-browser
            ${{ runner.temp }}/site/pagefind/search-build.json
            ${{ runner.temp }}/site/pagefind/search-governance.json
            ${{ runner.temp }}/site/pagefind/pagefind-entry.json
            ${{ runner.temp }}/site/data/content-catalog.json
            ${{ runner.temp }}/platform-discoverability.json
            ${{ runner.temp }}/site/data/article-catalog.json
            ${{ runner.temp }}/site/data/article-archive-build.json
            ${{ runner.temp }}/site/reports/article-canonical-migration.csv
            ${{ runner.temp }}/site/reports/content-taxonomy-audit.json
            ${{ runner.temp }}/site/build.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > "${RUNNER_TEMP}/site-sbom.cdx.json"
      - name: Preserve release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site-sbom-${{ github.run_id }}
          path: ${{ runner.temp }}/site-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        # User-approved freeze: retain the existing Pages deployment as rollback.
        if: ${{ false }}
        with:
          path: ${{ runner.temp }}/site
          include-hidden-files: true
      - name: Preserve exact validated site for parallel Cloudflare preview
        id: static-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validated-static-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  cloudflare-preview:
    # Never expose deployment credentials to a fork PR. Using pull_request,
    # not pull_request_target, also keeps the existing production deploy skipped.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: quality
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    concurrency:
      group: cloudflare-1200km-site-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Download this run's immutable quality artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.quality.outputs.static-artifact-id }}
          path: ./dist
          merge-multiple: true
      - name: Verify exact artifact bytes and isolated deployment configuration
        run: |
          npm run check-site-worker
          node scripts/check-static-artifact.mjs --site ./dist --site-commit "${GITHUB_SHA}"
          node scripts/check-companion-coverage.mjs --site ./dist
      - name: Install locked deployment tooling
        run: npm ci --prefix cloudflare
      - name: Require existing deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing repository Actions secret CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing repository Actions secret CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Deploy separate workers.dev site without production routes
        id: cloudflare-deployment
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          wranglerVersion: 4.142.0
          command: deploy --config wrangler.preview.json
      - name: Compare preview against artifact and existing production
        env:
          PREVIEW_URL: ${{ steps.cloudflare-deployment.outputs.deployment-url }}
        run: >-
          node scripts/verify-hosting-parity.mjs
          --site ./dist
          --preview-origin "$PREVIEW_URL"
          --report-only-differences
          --report "${RUNNER_TEMP}/cloudflare-parity.json"
      - name: Verify hosted Pagefind engine, search UI, and fragment navigation
        if: ${{ !cancelled() && steps.cloudflare-deployment.outcome == 'success' }}
        env:
          PREVIEW_URL: ${{ steps.cloudflare-deployment.outputs.deployment-url }}
        run: |
          set -o pipefail
          node scripts/check-search-browser.mjs --site ./dist --bundle ./dist/pagefind --origin "$PREVIEW_URL" --hosting-search-only 2>&1 | tee "${RUNNER_TEMP}/cloudflare-hosting-search.log"
      - name: Verify full browser integrations without relaxing CSP
        if: ${{ !cancelled() && steps.cloudflare-deployment.outcome == 'success' }}
        env:
          PREVIEW_URL: ${{ steps.cloudflare-deployment.outputs.deployment-url }}
        run: |
          set -o pipefail
          node scripts/check-search-browser.mjs --site ./dist --bundle ./dist/pagefind --origin "$PREVIEW_URL" 2>&1 | tee "${RUNNER_TEMP}/cloudflare-search-browser.log"
      - name: Preserve preview parity and browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudflare-preview-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cloudflare-parity.json
            ${{ runner.temp }}/cloudflare-hosting-search.log
            ${{ runner.temp }}/cloudflare-search-browser.log
          if-no-files-found: warn
          retention-days: 30

      - name: Verify every companion publication in real browsers
        if: ${{ !cancelled() && steps.cloudflare-deployment.outcome == 'success' }}
        env:
          PREVIEW_URL: ${{ steps.cloudflare-deployment.outputs.deployment-url }}
        run: node scripts/check-companion-browser.mjs --site ./dist --origin "$PREVIEW_URL" --report "${RUNNER_TEMP}/companion-browser.json"
      - name: Preserve companion browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: companion-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/companion-browser.json
          if-no-files-found: warn
          retention-days: 30

  cloudflare-production:
    # PRs can only update 1200km-site-preview. Only reviewed main can deploy
    # the live Worker, and only after the same artifact passes hosted checks.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_SITE_DEPLOY_ENABLED == 'true' }}
    needs: [quality, cloudflare-preview]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      live: ${{ steps.routing.outputs.proxied }}
    concurrency:
      group: cloudflare-1200km-site-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.quality.outputs.static-artifact-id }}
          path: ./dist
          merge-multiple: true
      - name: Verify immutable release artifact
        run: |
          node scripts/check-static-artifact.mjs --site ./dist --site-commit "${GITHUB_SHA}"
          node scripts/check-companion-coverage.mjs --site ./dist
          npm ci --prefix cloudflare
      - name: Deploy validated main release
        id: site-deployment
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          wranglerVersion: 4.142.0
          command: deploy --config wrangler.site.json
      - name: Read current routing state without changing DNS
        id: routing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/cloudflare-site-cutover.mjs --mode status --evidence "${RUNNER_TEMP}/cloudflare-routing.json"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const snapshot = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/cloudflare-routing.json`, 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `proxied=${snapshot.record.proxied}\n`);
          JS
      - name: Wait for the new custom-domain identity on subsequent releases
        if: ${{ steps.routing.outputs.proxied == 'true' }}
        run: >-
          node scripts/verify-production.mjs --custom-only
          --site-commit "${GITHUB_SHA}" --archive-commit "${ARTICLE_ARCHIVE_COMMIT}"
          --report "${RUNNER_TEMP}/live-release-identity.json"
      - name: Verify production Worker before DNS cutover
        env:
          WORKER_URL: ${{ steps.site-deployment.outputs.deployment-url }}
        run: |
          node scripts/verify-hosting-parity.mjs --site ./dist --preview-origin "$WORKER_URL" --migration-baseline cloudflare/migration-baseline.json --report "${RUNNER_TEMP}/production-worker-parity.json"
          node scripts/check-search-browser.mjs --site ./dist --bundle ./dist/pagefind --origin "$WORKER_URL"
      - name: Preserve production Worker evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-worker-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/production-worker-parity.json
            ${{ runner.temp }}/cloudflare-routing.json
            ${{ runner.temp }}/live-release-identity.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    # Do not publish the combined artifact to Pages. Its last release is frozen
    # as rollback; reactivation requires an explicit reviewed source change.
    if: ${{ false }}
    needs: quality
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        id: deployment

  production-verification:
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.cloudflare-production.result == 'success' && needs.cloudflare-production.outputs.live == 'true' }}
    needs: [quality, cloudflare-production]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Verify custom-domain production identity and fingerprints
        run: >-
          node scripts/verify-production.mjs
          --custom-only
          --site-commit "${GITHUB_SHA}"
          --archive-commit "${ARTICLE_ARCHIVE_COMMIT}"
          --report "${RUNNER_TEMP}/production-verification.json"
      - name: Preserve production diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/production-verification.json
          if-no-files-found: error
          retention-days: 30
